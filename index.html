<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 顶级决策指挥系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark-navy: #0f172a;
            --strategy-blue: #2563eb;
            --alert-red: #ef4444;
            --gold-star: #f59e0b;
            --paper-bg: #f8fafc;
            --card-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        }

        body { font-family: 'PingFang SC', sans-serif; background: #f1f5f9; margin: 0; color: var(--dark-navy); }

        /* --- 顶级指挥部 Header --- */
        .dashboard-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 60px 25px 90px; color: white; border-bottom-left-radius: 60px; border-bottom-right-radius: 60px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .header-title { font-size: 10px; letter-spacing: 5px; opacity: 0.5; text-transform: uppercase; margin-bottom: 10px; }
        .stat-row { display: flex; align-items: baseline; gap: 15px; }
        .total-num { font-size: 72px; font-weight: 900; letter-spacing: -3px; line-height: 1; }
        .total-label { font-size: 16px; font-weight: 600; opacity: 0.9; }

        /* --- 悬浮搜索仓 --- */
        .search-container { margin: -45px 20px 25px; position: relative; z-index: 100; }
        #searchBox {
            width: 100%; padding: 22px 25px 22px 65px; border: none; border-radius: 30px;
            background: white; box-shadow: var(--card-shadow); font-size: 16px; font-weight: 600; outline: none; box-sizing: border-box;
        }
        .search-icon { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: var(--strategy-blue); font-size: 20px; }

        /* --- 决策卡片：情报级设计 --- */
        .card {
            background: white; margin: 0 16px 20px; padding: 25px; border-radius: 40px;
            position: relative; overflow: hidden; transition: 0.4s; border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
        }
        
        /* 关系冷却警报：如果超过7天没联系，卡片边缘会有淡淡红光 */
        .card.cooling { border: 2px solid rgba(239, 68, 68, 0.2); animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.1); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .person-name { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
        .level-stars { color: var(--gold-star); font-size: 14px; }
        .time-info { font-size: 11px; background: #f1f5f9; padding: 5px 12px; border-radius: 15px; color: var(--strategy-blue); font-weight: 800; }

        .org-tag { font-size: 14px; color: #64748b; font-weight: 700; margin-bottom: 18px; display: flex; align-items: center; gap: 6px; }
        
        /* 情报笺设计 */
        .intel-memo {
            background: #fdfdfd; padding: 20px; border-radius: 20px; position: relative;
            border-left: 5px solid var(--strategy-blue); background-image: radial-gradient(#e2e8f0 1px, transparent 0); background-size: 20px 20px;
        }
        .intel-text { font-size: 15px; color: #334155; line-height: 1.7; font-weight: 500; }
        .intel-label { position: absolute; top: -10px; right: 20px; background: white; padding: 0 10px; font-size: 9px; font-weight: 900; color: #cbd5e1; letter-spacing: 2px; }

        .card-footer { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        .status-pill { padding: 6px 15px; border-radius: 12px; font-size: 12px; font-weight: 800; background: #eff6ff; color: var(--strategy-blue); }

        /* --- 交互控制台 --- */
        .tab-bar {
            position: fixed; bottom: 0; width: 100%; height: 95px; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(25px); display: flex; align-items: center; z-index: 1000;
            border-top: 1px solid rgba(0,0,0,0.05); padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-item { flex: 1; text-align: center; color: #94a3b8; font-size: 11px; font-weight: 800; transition: 0.3s; }
        .tab-item.active { color: var(--strategy-blue); }
        .tab-item i { font-size: 26px; margin-bottom: 5px; display: block; }

        .big-plus {
            width: 70px; height: 70px; background: var(--strategy-blue); color: white; border-radius: 25px;
            display: flex; align-items: center; justify-content: center; font-size: 32px;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.4); margin-top: -55px; border: 6px solid #f1f5f9;
        }

        /* --- 侧滑抽屉 & 详情 --- */
        .panel { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); display: none; z-index: 2000; align-items: flex-end; }
        .panel-sheet { background: white; width: 100%; border-radius: 50px 50px 0 0; padding: 40px 30px; box-sizing: border-box; max-height: 92vh; overflow-y: auto; }
        .input-box { width: 100%; padding: 18px; border: 2px solid #f1f5f9; border-radius: 22px; background: #f8fafc; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; font-weight: 600; }
        .input-box:focus { border-color: var(--strategy-blue); background: white; }
        .main-btn { width: 100%; padding: 22px; background: var(--dark-navy); color: white; border: none; border-radius: 25px; font-weight: 900; font-size: 18px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div id="view-main">
    <div class="dashboard-header">
        <div class="header-title">Tactical Asset Management</div>
        <div class="stat-row">
            <span class="total-num" id="totalCount">0</span>
            <span class="total-label">位深度联络的决策核心</span>
        </div>
    </div>

    <div class="search-container">
        <i class="fa-solid fa-radar search-icon"></i>
        <input type="text" id="searchBox" placeholder="搜寻档案、机构或核心痛点..." oninput="renderList()">
    </div>

    <div id="listContainer"></div>
</div>

<div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('main')"><i class="fa-solid fa-tower-observation"></i><span>中枢</span></div>
    <div class="tab-item" onclick="switchTab('ai')"><i class="fa-solid fa-microchip"></i><span>决策军师</span></div>
    <div class="big-plus" onclick="openPanel()"><i class="fa-solid fa-plus"></i></div>
    <div class="tab-item" onclick="switchTab('stats')"><i class="fa-solid fa-chart-line"></i><span>穿透分析</span></div>
    <div class="tab-item" onclick="syncData()"><i class="fa-solid fa-shield-halved"></i><span>云端同步</span></div>
</div>

<div class="panel" id="panel">
    <div class="panel-sheet">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h2 style="margin:0; font-weight:900; font-size:26px;">维护决策档案</h2>
            <i class="fa-solid fa-circle-xmark" onclick="closePanel()" style="font-size:32px; color:#e2e8f0;"></i>
        </div>
        <input type="hidden" id="editId">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
            <input type="text" id="name" class="input-box" placeholder="姓名">
            <select id="gender" class="input-box"><option>🚹 男</option><option>🚺 女</option></select>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
            <select id="level" class="input-box"><option value="⭐">⭐ 普通联系</option><option value="⭐⭐⭐">⭐⭐⭐ 重要资源</option><option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ 核心决策人</option></select>
            <select id="status" class="input-box"><option>💡 初步接触</option><option>🤝 正式签约</option><option>⏸️ 暂时搁置</option></select>
        </div>
        <input type="text" id="company" class="input-box" placeholder="公司 / 机构名称">
        <input type="text" id="job" class="input-box" placeholder="当前职务">
        <input type="tel" id="phone" class="input-box" placeholder="联系电话">
        <textarea id="demands" rows="5" class="input-box" placeholder="核心备忘：痛点、性格偏好、利益分配、谈判重点..."></textarea>
        <button class="main-btn" onclick="saveData()">确 认 同 步</button>
        <div id="delArea" style="text-align:center; margin-top:20px; display:none;">
            <span onclick="deleteData()" style="color:var(--alert-red); font-weight:800; font-size:14px; text-decoration:underline;">彻底抹除此条决策档案</span>
        </div>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];

    async function init() {
        const { data } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
        customers = data || [];
        renderList();
    }

    function renderList() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        const list = customers.filter(c => Object.values(c).some(v => String(v).toLowerCase().includes(kw)));
        document.getElementById('totalCount').innerText = list.length;

        list.forEach(c => {
            const diffDays = Math.floor((new Date() - new Date(c.created_at)) / (1000 * 60 * 60 * 24));
            const isCooling = diffDays > 7 && c.level.includes('⭐⭐⭐⭐⭐');
            
            const card = document.createElement('div');
            card.className = `card ${isCooling ? 'cooling' : ''}`;
            card.onclick = () => editData(c.id);
            card.innerHTML = `
                <div class="card-top">
                    <div>
                        <div class="person-name">${c.name} ${c.gender.includes('女') ? '👩‍💼' : '👨‍💼'}</div>
                        <div class="level-stars">${c.level}</div>
                    </div>
                    <span class="time-info">${diffDays === 0 ? '今日同步' : diffDays + ' 天前更新'}</span>
                </div>
                <div class="org-tag"><i class="fa-solid fa-briefcase"></i> ${c.company || '核心资产'} · ${c.job || '负责人'}</div>
                <div class="intel-memo">
                    <div class="intel-label">TOP SECRET MEMO</div>
                    <div class="intel-text">${c.demands || '尚未录入深度决策备忘录，建议立即补充关键情报。'}</div>
                </div>
                <div class="card-footer">
                    <span class="status-pill"><i class="fa-solid fa-shield-check"></i> ${c.status}</span>
                    <i class="fa-solid fa-chevron-right" style="color:#cbd5e1"></i>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // --- 核心逻辑 ---
    function openPanel() {
        document.getElementById('editId').value = '';
        document.getElementById('delArea').style.display = 'none';
        document.querySelectorAll('.input-box').forEach(i => i.value = '');
        document.getElementById('panel').style.display = 'flex';
    }
    function closePanel() { document.getElementById('panel').style.display = 'none'; }

    function editData(id) {
        const c = customers.find(x => x.id == id);
        document.getElementById('editId').value = c.id;
        ['name','gender','level','status','company','job','phone','demands'].forEach(k => document.getElementById(k).value = c[k] || '');
        document.getElementById('delArea').style.display = 'block';
        document.getElementById('panel').style.display = 'flex';
    }

    async function saveData() {
        const row = {
            name: document.getElementById('name').value,
            gender: document.getElementById('gender').value,
            level: document.getElementById('level').value,
            status: document.getElementById('status').value,
            company: document.getElementById('company').value,
            job: document.getElementById('job').value,
            phone: document.getElementById('phone').value,
            demands: document.getElementById('demands').value
        };
        const id = document.getElementById('editId').value;
        if(id) await supabaseClient.from('customers').update(row).eq('id', id);
        else await supabaseClient.from('customers').insert([row]);
        await init(); closePanel();
    }

    async function deleteData() { if(confirm("该档案包含重要决策情报，确定彻底抹除？")) { await supabaseClient.from('customers').delete().eq('id', document.getElementById('editId').value); await init(); closePanel(); } }
    function switchTab(t) { if(t !== 'main') alert(t + " 模块正在实时接入大数据决策模型..."); }
    function syncData() { alert("决策情报库已通过银行级加密同步至云端。"); }

    init();
</script>
</body>
</html>
