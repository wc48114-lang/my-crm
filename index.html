<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 顶级决策终端</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #f0f4f8;
            --primary: #2563eb;
            --dark: #0f172a;
            --card-bg: #ffffff;
            --accent: #f59e0b;
            --text-main: #1e293b;
            --text-sub: #64748b;
        }

        body { font-family: 'PingFang SC', -apple-system, sans-serif; background: var(--bg); margin: 0; color: var(--text-main); line-height: 1.5; padding-bottom: 100px; }

        /* --- 动态顶部：更霸气 --- */
        .hero-section {
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
            padding: 50px 25px 70px;
            color: white;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.2);
        }
        .hero-label { font-size: 10px; text-transform: uppercase; letter-spacing: 4px; opacity: 0.5; margin-bottom: 8px; }
        .hero-main { display: flex; align-items: baseline; gap: 12px; }
        .hero-number { font-size: 64px; font-weight: 900; letter-spacing: -2px; }
        .hero-desc { font-size: 14px; opacity: 0.8; font-weight: 500; }

        /* --- 搜索框：悬浮质感 --- */
        .search-wrapper { margin: -35px 20px 20px; position: relative; z-index: 10; }
        #searchBox {
            width: 100%; padding: 20px 25px 20px 60px; border: none; border-radius: 25px;
            background: var(--card-bg); box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            font-size: 16px; outline: none; box-sizing: border-box;
        }
        .search-icon { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: var(--text-sub); font-size: 20px; }

        /* --- 决策卡片：重新设计 --- */
        .decision-card {
            background: var(--card-bg); margin: 0 16px 20px; padding: 25px; border-radius: 35px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.02); position: relative; overflow: hidden;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(255,255,255,0.5);
        }
        .decision-card:active { transform: scale(0.96); }
        .vip-border { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--primary); }
        .vip-gold { background: linear-gradient(to bottom, #f59e0b, #d97706); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .name-tag { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
        .time-badge { font-size: 11px; background: #f1f5f9; padding: 4px 12px; border-radius: 12px; color: var(--text-sub); font-weight: 700; }

        .org-info { font-size: 14px; color: var(--primary); font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 6px; }
        
        .memo-content {
            background: #f8fafc; padding: 18px; border-radius: 22px; font-size: 15px;
            color: #334155; line-height: 1.6; position: relative; border: 1px dashed #e2e8f0;
        }
        .memo-label { position: absolute; top: -10px; left: 20px; background: var(--card-bg); padding: 0 8px; font-size: 10px; font-weight: 900; color: #cbd5e1; }

        .card-footer { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .status-pill { font-size: 11px; padding: 5px 12px; border-radius: 10px; background: #eef2ff; color: var(--primary); font-weight: 800; }

        /* --- 交互元素 --- */
        .tab-nav {
            position: fixed; bottom: 0; width: 100%; height: 90px; background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px); display: flex; align-items: center; z-index: 1000;
            border-top: 1px solid rgba(0,0,0,0.03); padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-btn { flex: 1; text-align: center; color: #94a3b8; font-size: 11px; font-weight: 800; transition: 0.3s; }
        .nav-btn.active { color: var(--primary); }
        .nav-btn i { font-size: 24px; margin-bottom: 4px; display: block; }

        .center-add {
            width: 65px; height: 65px; background: var(--primary); color: white; border-radius: 22px;
            display: flex; align-items: center; justify-content: center; font-size: 28px;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.3); margin-top: -50px; border: 6px solid var(--bg);
        }

        /* --- 模态框重绘 --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); display: none; z-index: 2000; align-items: flex-end; }
        .modal-sheet { background: white; width: 100%; border-radius: 45px 45px 0 0; padding: 35px 25px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        .fancy-input { width: 100%; padding: 18px; border: 2px solid #f1f5f9; border-radius: 20px; background: #f8fafc; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; transition: 0.3s; }
        .fancy-input:focus { border-color: var(--primary); background: white; }
        .submit-trigger { width: 100%; padding: 20px; background: var(--dark); color: white; border: none; border-radius: 22px; font-weight: 900; font-size: 17px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div id="view-list">
    <div class="hero-section">
        <div class="hero-label">Tactical Intelligence</div>
        <div class="hero-main">
            <span class="hero-number" id="totalCount">0</span>
            <span class="hero-desc">位深度联络的决策核心</span>
        </div>
    </div>

    <div class="search-wrapper">
        <i class="fa-solid fa-fingerprint search-icon"></i>
        <input type="text" id="searchBox" placeholder="搜寻档案、机构或决策痛点..." oninput="renderList()">
    </div>

    <div id="mainContainer"></div>
</div>

<div class="tab-nav">
    <div class="nav-btn active" onclick="showView('list')"><i class="fa-solid fa-house-chimney-window"></i><span>中枢</span></div>
    <div class="nav-btn" onclick="showView('ai')"><i class="fa-solid fa-brain"></i><span>决策军师</span></div>
    <div class="center-add" onclick="openDrawer()"><i class="fa-solid fa-plus"></i></div>
    <div class="nav-btn" onclick="showView('stats')"><i class="fa-solid fa-bolt"></i><span>穿透分析</span></div>
    <div class="nav-btn" onclick="exportData()"><i class="fa-solid fa-cloud-shield"></i><span>云同步</span></div>
</div>

<div class="modal-overlay" id="drawer">
    <div class="modal-sheet">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
            <h2 style="margin:0; font-size:24px; font-weight:900;">建立决策档案</h2>
            <i class="fa-solid fa-circle-xmark" onclick="closeDrawer()" style="font-size:30px; color:#e2e8f0;"></i>
        </div>
        <input type="hidden" id="editId">
        <div style="display:grid; grid-template-columns: 1.5fr 1fr; gap:12px;">
            <input type="text" id="name" class="fancy-input" placeholder="姓名">
            <select id="gender" class="fancy-input"><option>🚹 男</option><option>🚺 女</option></select>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
            <select id="level" class="fancy-input"><option value="⭐">⭐ 普通</option><option value="⭐⭐⭐">⭐⭐⭐ 重要</option><option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ 核心</option></select>
            <select id="status" class="fancy-input"><option>💡 初步接触</option><option>🤝 正式签约</option><option>⏸️ 暂时搁置</option></select>
        </div>
        <input type="text" id="company" class="fancy-input" placeholder="公司 / 机构 / 职务">
        <input type="tel" id="phone" class="fancy-input" placeholder="联系电话">
        <textarea id="demands" rows="4" class="fancy-input" placeholder="输入决策备忘：痛点、需求、突破口..."></textarea>
        <button class="submit-trigger" onclick="saveData()">确 认 同 步</button>
        <button id="delBtn" onclick="deleteData()" style="width:100%; border:none; background:none; color:#ef4444; margin-top:20px; font-weight:800; display:none;">抹除此条决策档案</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];

    async function init() {
        const { data } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
        customers = data || [];
        renderList();
    }

    function renderList() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('mainContainer');
        container.innerHTML = '';
        const list = customers.filter(c => Object.values(c).some(v => String(v).toLowerCase().includes(kw)));
        document.getElementById('totalCount').innerText = list.length;

        list.forEach(c => {
            const isVip = c.level.includes('⭐⭐⭐⭐⭐');
            const createdDate = new Date(c.created_at);
            const diffDays = Math.floor((new Date() - createdDate) / (1000 * 60 * 60 * 24));
            
            const card = document.createElement('div');
            card.className = 'decision-card';
            card.onclick = () => editData(c.id);
            card.innerHTML = `
                ${isVip ? '<div class="vip-border vip-gold"></div>' : '<div class="vip-border"></div>'}
                <div class="card-header">
                    <span class="name-tag">${c.name} ${c.gender === '🚺 女' ? '👩‍💼' : '👨‍💼'}</span>
                    <span class="time-badge">${diffDays === 0 ? '今日新增' : diffDays + ' 天前记录'}</span>
                </div>
                <div class="org-info"><i class="fa-solid fa-landmark"></i> ${c.company || '核心资产'}</div>
                <div class="memo-content">
                    <div class="memo-label">DECISION MEMO</div>
                    ${c.demands || '尚未录入深度决策备忘录'}
                </div>
                <div class="card-footer">
                    <span class="status-pill">${c.status}</span>
                    <span class="status-pill" style="background:#fff7ed; color:#ea580c;">${c.level}</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 基础逻辑
    function openDrawer() {
        document.getElementById('editId').value = '';
        document.getElementById('delBtn').style.display = 'none';
        document.querySelectorAll('.fancy-input').forEach(i => i.value = '');
        document.getElementById('drawer').style.display = 'flex';
    }
    function closeDrawer() { document.getElementById('drawer').style.display = 'none'; }

    function editData(id) {
        const c = customers.find(x => x.id == id);
        document.getElementById('editId').value = c.id;
        document.getElementById('name').value = c.name;
        document.getElementById('gender').value = c.gender;
        document.getElementById('level').value = c.level;
        document.getElementById('status').value = c.status;
        document.getElementById('company').value = c.company;
        document.getElementById('phone').value = c.phone;
        document.getElementById('demands').value = c.demands;
        document.getElementById('delBtn').style.display = 'block';
        document.getElementById('drawer').style.display = 'flex';
    }

    async function saveData() {
        const row = {
            name: document.getElementById('name').value,
            gender: document.getElementById('gender').value,
            level: document.getElementById('level').value,
            status: document.getElementById('status').value,
            company: document.getElementById('company').value,
            phone: document.getElementById('phone').value,
            demands: document.getElementById('demands').value
        };
        const id = document.getElementById('editId').value;
        if(id) await supabaseClient.from('customers').update(row).eq('id', id);
        else await supabaseClient.from('customers').insert([row]);
        await init(); closeDrawer();
    }

    async function deleteData() { if(confirm("确定抹除此档案？")) { await supabaseClient.from('customers').delete().eq('id', document.getElementById('editId').value); await init(); closeDrawer(); } }
    function showView(v) { alert(v + " 模块正在深度校准中..."); }
    function exportData() { alert("决策数据已安全上云"); }

    init();
</script>
</body>
</html>
