<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 决策中心 Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand: #2563eb;
            --brand-dark: #1e40af;
            --bg-base: #f1f5f9;
            --surface: #ffffff;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #f59e0b;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-body);
            margin: 0;
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
        }

        /* 顶部行政风格 Header */
        .app-header {
            background: var(--text-heading);
            padding: 60px 24px 40px;
            color: white;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.2);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .app-logo { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .header-stats { margin-top: 25px; }
        .stats-count { font-size: 40px; font-weight: 900; }
        .stats-label { font-size: 13px; opacity: 0.6; margin-left: 5px; }

        /* 专业搜索组件 */
        .search-container {
            margin: -30px 20px 20px;
            position: relative;
            z-index: 50;
        }
        #searchBox {
            width: 100%;
            padding: 18px 24px 18px 54px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--surface);
            box-shadow: 0 12px 24px -6px rgba(0,0,0,0.08);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #searchBox:focus { border-color: var(--brand); box-shadow: 0 10px 30px -10px rgba(37, 99, 235, 0.3); }
        .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* 客户卡片精装修 */
        .customer-card {
            background: var(--surface);
            margin: 0 16px 16px;
            padding: 24px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02), 0 2px 4px -1px rgba(0,0,0,0.01);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .customer-card:active { transform: scale(0.98); background: #f8fafc; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
        .client-name { font-size: 20px; font-weight: 700; color: var(--text-heading); display: flex; align-items: center; gap: 8px; }
        .gender-badge { font-size: 11px; background: #e0e7ff; color: #4338ca; padding: 2px 8px; border-radius: 6px; }

        .rating-stars { color: var(--accent); font-size: 12px; display: flex; gap: 2px; }
        .star-item { opacity: 0; transform: translateY(5px); animation: fadeInUp 0.4s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        .info-pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .info-pill { background: #f1f5f9; border: 1px solid #e2e8f0; color: var(--text-body); padding: 5px 12px; border-radius: 10px; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 5px; }
        .pill-status { background: #ecfdf5; color: #065f46; border-color: #d1fae5; }

        .memo-preview {
            background: #fafafb;
            border-radius: 16px;
            padding: 14px;
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            border: 1px dashed #e2e8f0;
        }

        /* 底部硬朗导航 */
        .app-nav {
            position: fixed;
            bottom: 0; width: 100%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            height: 75px;
            display: flex; justify-content: space-around;
            border-top: 1px solid var(--border);
            z-index: 100;
        }
        .nav-tab { color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-decoration: none; font-size: 11px; font-weight: 600; gap: 4px; }
        .nav-tab.active { color: var(--brand); }
        .nav-tab i { font-size: 20px; }

        .main-fab {
            width: 60px; height: 60px;
            background: var(--brand);
            color: white;
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
            position: fixed;
            bottom: 30px; left: 50%; transform: translateX(-50%);
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
            z-index: 110;
        }

        /* 模态框精修 */
        .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; z-index: 200; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content {
            background: white; width: 90%; max-width: 450px;
            border-radius: 32px; padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            max-height: 85vh; overflow-y: auto;
        }
        .form-label { font-size: 12px; font-weight: 700; color: var(--text-heading); margin: 15px 0 8px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select, textarea { width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box; }
        input:focus { border-color: var(--brand); background: #f8faff; }

        .btn-submit {
            width: 100%; padding: 16px; background: var(--text-heading);
            color: white; border: none; border-radius: 16px;
            font-size: 16px; font-weight: 700; margin-top: 25px;
            transition: background 0.2s;
        }
        .btn-submit:active { background: #000; }

        /* 详情页专用 */
        #detailPage { display: none; padding: 20px; }
        .detail-header { text-align: center; margin-bottom: 30px; }
        .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .action-card { background: white; padding: 15px; border-radius: 20px; text-align: center; font-size: 13px; font-weight: 600; color: var(--brand); border: 1px solid var(--border); }
    </style>
</head>
<body>

<div id="listView">
    <div class="app-header">
        <div class="header-top">
            <span class="app-logo">PRECISION CRM</span>
            <i class="fa-solid fa-bell" style="font-size: 18px; opacity: 0.6;"></i>
        </div>
        <div class="header-stats">
            <div class="stats-count" id="totalCount">0</div>
            <div class="stats-label">ACTIVE CLIENTS</div>
        </div>
    </div>

    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchBox" placeholder="搜索姓名、公司或备注...">
    </div>

    <div id="customerList"></div>
</div>

<div id="detailPage">
    <div onclick="showList()" style="margin-bottom: 20px; font-size: 14px; font-weight: 600; color: var(--text-muted);">
        <i class="fa-solid fa-arrow-left"></i> BACK TO LIST
    </div>
    <div id="detailContent"></div>
</div>

<div id="dashboardView" style="display:none; padding: 20px;">
    <h3 style="margin: 40px 0 20px;">决策统计分析</h3>
    <div style="background:white; border-radius:30px; padding:25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
        <canvas id="statusChart"></canvas>
    </div>
</div>

<div class="app-nav">
    <div class="nav-tab active" id="tabHome" onclick="showList()">
        <i class="fa-solid fa-house-user"></i>
        <span>CLIENTS</span>
    </div>
    <div class="nav-tab" id="tabStats" onclick="showStats()">
        <i class="fa-solid fa-chart-pie"></i>
        <span>ANALYTICS</span>
    </div>
    <div class="nav-tab" onclick="exportData()">
        <i class="fa-solid fa-cloud-arrow-down"></i>
        <span>BACKUP</span>
    </div>
</div>

<div class="main-fab" onclick="openModal()">
    <i class="fa-solid fa-plus"></i>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:18px; font-weight:800;" id="modalTitle">NEW RECORD</span>
            <i class="fa-solid fa-circle-xmark" onclick="closeModal()" style="font-size:24px; color:var(--text-muted);"></i>
        </div>
        
        <input type="hidden" id="editId">
        <label class="form-label">Client Name</label>
        <input type="text" id="name" placeholder="输入全名">

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div>
                <label class="form-label">Gender</label>
                <select id="gender"><option>🚹 男</option><option>🚺 女</option></select>
            </div>
            <div>
                <label class="form-label">Priority</label>
                <select id="level"><option>⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select>
            </div>
        </div>

        <label class="form-label">Organization</label>
        <input type="text" id="company" placeholder="所属公司/机构">

        <label class="form-label">Lifecycle Stage</label>
        <select id="status">
            <option>💡 初步接触</option>
            <option>🤝 正式签约</option>
            <option>⏸️ 暂时搁置</option>
            <option>❌ 停止合作</option>
        </select>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
            <div><label class="form-label">Phone</label><input type="tel" id="phone"></div>
            <div><label class="form-label">Wechat</label><input type="text" id="wechat"></div>
        </div>

        <label class="form-label">Executive Memo</label>
        <textarea id="demands" rows="4" placeholder="记录关键决策信息..."></textarea>

        <button class="btn-submit" id="saveBtn" onclick="saveData()">CONFIRM & SYNC</button>
        <button id="delBtn" onclick="deleteData()" style="width:100%; background:none; border:none; color:#ef4444; margin-top:15px; font-weight:700; display:none;">TERMINATE RECORD</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    
    let customers = [];
    let myChart = null;

    async function init() {
        try {
            const { data, error } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            customers = data || [];
            render();
        } catch (e) { console.error("Sync Error"); }
    }

    function render() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('customerList');
        container.innerHTML = '';
        
        const list = customers.filter(c => Object.values(c).some(v => String(v).toLowerCase().includes(kw)));
        document.getElementById('totalCount').innerText = list.length;

        list.forEach((c, idx) => {
            const card = document.createElement('div');
            card.className = 'customer-card';
            card.onclick = () => showDetail(c.id);

            let stars = '';
            const count = (c.level.match(/⭐/g) || []).length;
            for(let i=0; i<count; i++) stars += `<span class="star-item" style="animation-delay:${i*0.08}s">⭐</span>`;

            card.innerHTML = `
                <div class="card-header">
                    <div class="client-name">${c.name} <span class="gender-badge">${c.gender}</span></div>
                    <div class="rating-stars">${stars}</div>
                </div>
                <div class="info-pill-row">
                    <div class="info-pill"><i class="fa-solid fa-briefcase"></i> ${c.company || 'Private'}</div>
                    <div class="info-pill pill-status"><i class="fa-solid fa-signal"></i> ${c.status}</div>
                </div>
                <div class="memo-preview">${c.demands ? c.demands.substring(0,50)+'...' : 'No executive notes recorded.'}</div>
            `;
            container.appendChild(card);
        });
    }

    function showList() {
        document.getElementById('listView').style.display = 'block';
        document.getElementById('detailPage').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'none';
        document.getElementById('tabHome').classList.add('active');
        document.getElementById('tabStats').classList.remove('active');
    }

    function showStats() {
        document.getElementById('listView').style.display = 'none';
        document.getElementById('detailPage').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'block';
        document.getElementById('tabHome').classList.remove('active');
        document.getElementById('tabStats').classList.add('active');
        renderChart();
    }

    function showDetail(id) {
        const c = customers.find(x => x.id == id);
        document.getElementById('listView').style.display = 'none';
        const detail = document.getElementById('detailPage');
        detail.style.display = 'block';
        
        document.getElementById('detailContent').innerHTML = `
            <div style="background:white; border-radius:30px; padding:30px; box-shadow:0 10px 40px rgba(0,0,0,0.05);">
                <div style="text-align:center;">
                    <div style="font-size:28px; font-weight:900;">${c.name}</div>
                    <div style="color:var(--brand); font-weight:700; margin-top:5px;">${c.status}</div>
                </div>
                <div class="detail-actions">
                    <div class="action-card" onclick="location.href='tel:${c.phone}'"><i class="fa-solid fa-phone"></i><br>DIAL</div>
                    <div class="action-card" onclick="copyText('${c.wechat}')"><i class="fa-solid fa-message"></i><br>WECHAT</div>
                </div>
                <div style="margin-top:30px;">
                    <div class="form-label">ORGANIZATION</div>
                    <div style="font-weight:600;">${c.company || 'Not Specified'}</div>
                    <div class="form-label">MEMO & STRATEGY</div>
                    <div style="background:#f8fafc; padding:20px; border-radius:20px; font-size:14px; line-height:1.7; color:var(--text-body); border:1px solid #e2e8f0;">${c.demands || 'N/A'}</div>
                </div>
                <button class="btn-submit" onclick="editData(${c.id})">MODIFY PROFILE</button>
            </div>
        `;
    }

    function renderChart() {
        const stats = {};
        customers.forEach(c => stats[c.status] = (stats[c.status] || 0) + 1);
        const ctx = document.getElementById('statusChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(stats),
                datasets: [{ data: Object.values(stats), backgroundColor: ['#2563eb', '#f59e0b', '#10b981', '#ef4444'], borderWidth: 0 }]
            },
            options: { cutout: '80%', plugins: { legend: { position: 'bottom' } } }
        });
    }

    function openModal() {
        document.getElementById('editId').value = '';
        document.getElementById('modalTitle').innerText = 'NEW CLIENT RECORD';
        document.getElementById('delBtn').style.display = 'none';
        document.querySelectorAll('#modal input, #modal textarea').forEach(i => i.value = '');
        document.getElementById('modal').classList.add('show');
    }

    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    function editData(id) {
        const c = customers.find(x => x.id == id);
        document.getElementById('editId').value = c.id;
        document.getElementById('name').value = c.name;
        document.getElementById('gender').value = c.gender;
        document.getElementById('level').value = c.level;
        document.getElementById('status').value = c.status;
        document.getElementById('phone').value = c.phone || '';
        document.getElementById('wechat').value = c.wechat || '';
        document.getElementById('company').value = c.company || '';
        document.getElementById('demands').value = c.demands || '';
        document.getElementById('modalTitle').innerText = 'UPDATE RECORD';
        document.getElementById('delBtn').style.display = 'block';
        document.getElementById('modal').classList.add('show');
    }

    async function saveData() {
        const name = document.getElementById('name').value;
        if(!name) return alert("Required: Name");
        const btn = document.getElementById('saveBtn');
        btn.innerText = "SYNCING..."; btn.disabled = true;

        const row = {
            name, gender: document.getElementById('gender').value,
            level: document.getElementById('level').value, status: document.getElementById('status').value,
            phone: document.getElementById('phone').value, wechat: document.getElementById('wechat').value,
            company: document.getElementById('company').value, demands: document.getElementById('demands').value
        };

        const id = document.getElementById('editId').value;
        try {
            if(id) await supabaseClient.from('customers').update(row).eq('id', id);
            else await supabaseClient.from('customers').insert([row]);
            await init(); closeModal(); showList();
        } catch (e) { alert("Sync Failed"); }
        finally { btn.innerText = "CONFIRM & SYNC"; btn.disabled = false; }
    }

    async function deleteData() {
        if(confirm("Confirm to terminate this record?")) {
            await supabaseClient.from('customers').delete().eq('id', document.getElementById('editId').value);
            await init(); closeModal(); showList();
        }
    }

    function copyText(txt) {
        if(!txt) return alert("No ID available");
        navigator.clipboard.writeText(txt);
        alert("Wechat ID Copied");
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(customers));
        const dl = document.createElement('a');
        dl.setAttribute("href", dataStr);
        dl.setAttribute("download", `CRM_BACKUP_${new Date().toLocaleDateString()}.json`);
        dl.click();
    }

    document.getElementById('searchBox').oninput = render;
    init();
</script>
</body>
</html>
