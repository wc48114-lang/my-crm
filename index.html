<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 决策全能终端</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --dark: #0f172a;
            --primary: #2563eb;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text-sub: #64748b;
        }

        body { font-family: 'PingFang SC', sans-serif; background: var(--bg); margin: 0; color: var(--dark); padding-bottom: 110px; }

        /* --- 头部视觉 --- */
        .hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            padding: 50px 25px 80px; color: white; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px;
        }
        .hero-num { font-size: 65px; font-weight: 900; letter-spacing: -2px; }

        /* --- 搜索与列表 --- */
        .search-area { margin: -40px 20px 20px; position: relative; z-index: 10; }
        #searchBox {
            width: 100%; padding: 20px 25px 20px 60px; border: none; border-radius: 25px;
            background: white; box-shadow: 0 15px 35px rgba(0,0,0,0.08); font-size: 16px; outline: none; box-sizing: border-box;
        }
        .search-icon { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: var(--primary); }

        /* --- 决策卡片 --- */
        .card {
            background: white; margin: 0 16px 18px; padding: 22px; border-radius: 35px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03); position: relative;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .name { font-size: 24px; font-weight: 900; }
        .time-tag { font-size: 11px; color: var(--primary); font-weight: 800; background: #eff6ff; padding: 4px 10px; border-radius: 10px; }
        
        .org-info { font-size: 14px; color: var(--text-sub); margin-bottom: 15px; display: flex; align-items: center; gap: 6px; }
        .memo-box { background: #f1f5f9; padding: 18px; border-radius: 20px; font-size: 14px; line-height: 1.6; border-left: 4px solid var(--primary); }

        /* --- 详情页面 --- */
        .page-view { display: none; padding: 20px; }
        .page-view.active { display: block; }
        .detail-card { background: white; border-radius: 40px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        .action-btn { flex: 1; padding: 18px; border-radius: 20px; text-align: center; font-weight: 800; text-decoration: none; }

        /* --- 底部控制台 --- */
        .tab-bar {
            position: fixed; bottom: 0; width: 100%; height: 95px; background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px); display: flex; align-items: center; z-index: 1000; border-top: 1px solid #eee;
        }
        .tab-item { flex: 1; text-align: center; color: #94a3b8; font-size: 11px; font-weight: 800; }
        .tab-item.active { color: var(--primary); }
        .tab-item i { font-size: 24px; margin-bottom: 4px; display: block; }
        .add-btn { width: 65px; height: 65px; background: var(--primary); color: white; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -45px; border: 6px solid var(--bg); }

        /* --- 录入表单 (不漏掉一个字段) --- */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 2000; align-items: flex-end; }
        .modal-content { background: white; width: 100%; border-radius: 40px 40px 0 0; padding: 30px; max-height: 90vh; overflow-y: auto; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: 800; color: var(--text-sub); margin-bottom: 5px; }
        .input { width: 100%; padding: 15px; border: 2px solid #f1f5f9; border-radius: 18px; background: #f8fafc; box-sizing: border-box; font-size: 16px; font-weight: 600; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .save-btn { width: 100%; padding: 20px; background: var(--dark); color: white; border: none; border-radius: 22px; font-weight: 900; font-size: 17px; margin-top: 15px; }
    </style>
</head>
<body>

<div id="view-list" class="page-view active" style="padding:0;">
    <div class="hero">
        <div style="opacity:0.5; font-size:10px; letter-spacing:3px;">TACTICAL INTELLIGENCE</div>
        <div class="hero-num" id="totalCount">0</div>
        <div style="font-weight:700;">位深度联络的决策核心</div>
    </div>
    <div class="search-area">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="searchBox" placeholder="搜寻姓名、职务、备注..." oninput="renderList()">
    </div>
    <div id="listContainer"></div>
</div>

<div id="view-ai" class="page-view">
    <h1 style="font-weight:900;">AI 决策建议</h1>
    <div id="aiContainer"></div>
</div>

<div id="view-stats" class="page-view">
    <h1 style="font-weight:900;">资源穿透分析</h1>
    <div style="background:white; padding:20px; border-radius:30px;"><canvas id="statChart"></canvas></div>
</div>

<div id="view-detail" class="page-view">
    <div onclick="switchTab('list')" style="font-weight:800; color:var(--text-sub); margin-bottom:20px;"><i class="fa-solid fa-chevron-left"></i> 返回档案库</div>
    <div id="detailContainer"></div>
</div>

<div class="tab-bar">
    <div class="tab-item active" id="tab-list" onclick="switchTab('list')"><i class="fa-solid fa-house-chimney-crack"></i><span>中枢</span></div>
    <div class="tab-item" id="tab-ai" onclick="switchTab('ai')"><i class="fa-solid fa-brain"></i><span>军师</span></div>
    <div class="add-btn" onclick="openForm()"><i class="fa-solid fa-plus"></i></div>
    <div class="tab-item" id="tab-stats" onclick="switchTab('stats')"><i class="fa-solid fa-chart-pie"></i><span>穿透</span></div>
    <div class="tab-item" onclick="syncData()"><i class="fa-solid fa-cloud-arrow-up"></i><span>同步</span></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h2 style="margin:0; font-weight:900;">档案维护</h2>
            <i class="fa-solid fa-times-circle" onclick="closeForm()" style="font-size:28px; color:#ddd;"></i>
        </div>
        <input type="hidden" id="editId">
        <div class="grid">
            <div class="input-group"><label>姓名</label><input type="text" id="name" class="input"></div>
            <div class="input-group"><label>性别</label><select id="gender" class="input"><option>🚹 男</option><option>🚺 女</option></select></div>
        </div>
        <div class="grid">
            <div class="input-group"><label>级别</label><select id="level" class="input"><option>⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select></div>
            <div class="input-group"><label>状态</label><select id="status" class="input"><option>💡 初步接触</option><option>🤝 正式签约</option><option>⏸️ 暂时搁置</option></select></div>
        </div>
        <div class="grid">
            <div class="input-group"><label>机构/公司</label><input type="text" id="company" class="input"></div>
            <div class="input-group"><label>职务</label><input type="text" id="job" class="input"></div>
        </div>
        <div class="grid">
            <div class="input-group"><label>电话</label><input type="tel" id="phone" class="input"></div>
            <div class="input-group"><label>微信</label><input type="text" id="wechat" class="input"></div>
        </div>
        <div class="grid">
            <div class="input-group"><label>来源渠道</label><input type="text" id="source" class="input" placeholder="例：朋友介绍"></div>
            <div class="input-group"><label>生日</label><input type="date" id="birthday" class="input"></div>
        </div>
        <div class="input-group"><label>决策备忘（核心诉求/痛点/偏好）</label><textarea id="demands" rows="4" class="input"></textarea></div>
        <button class="save-btn" onclick="saveData()">同步至决策云端</button>
        <button id="delBtn" onclick="deleteRecord()" style="width:100%; background:none; border:none; color:red; margin-top:15px; font-weight:800; display:none;">彻底移除此档案</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];
    let myChart = null;

    async function init() {
        const { data } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
        customers = data || [];
        renderList();
    }

    function switchTab(view) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
        if(document.getElementById('tab-' + view)) document.getElementById('tab-' + view).classList.add('active');
        if(view === 'ai') renderAI();
        if(view === 'stats') renderChart();
    }

    function renderList() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        const list = customers.filter(c => Object.values(c).some(v => String(v).toLowerCase().includes(kw)));
        document.getElementById('totalCount').innerText = list.length;

        list.forEach(c => {
            const diffDays = Math.floor((new Date() - new Date(c.created_at)) / (1000 * 60 * 60 * 24));
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => showDetail(c.id);
            div.innerHTML = `
                <div class="card-header">
                    <span class="name">${c.name} ${c.gender.includes('女') ? '👩‍💼' : '👨‍💼'}</span>
                    <span class="time-tag">${diffDays === 0 ? '今日同步' : diffDays + ' 天前更新'}</span>
                </div>
                <div class="org-info"><i class="fa-solid fa-briefcase"></i> ${c.company} · ${c.job}</div>
                <div class="memo-box">${c.demands ? c.demands.substring(0, 40) + '...' : '暂无决策备注'}</div>
                <div style="margin-top:12px; display:flex; gap:8px;">
                    <span style="font-size:11px; padding:4px 8px; background:#fef3c7; color:#92400e; border-radius:5px; font-weight:800;">${c.status}</span>
                    <span style="font-size:11px; padding:4px 8px; background:#e0f2fe; color:#0369a1; border-radius:5px; font-weight:800;">${c.level}</span>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function showDetail(id) {
        const c = customers.find(x => x.id == id);
        switchTab('detail');
        document.getElementById('detailContainer').innerHTML = `
            <div class="detail-card">
                <div style="text-align:center; margin-bottom:25px;">
                    <h2 style="font-size:32px; margin:0;">${c.name}</h2>
                    <div style="color:var(--primary); font-weight:800; margin-top:5px;">${c.company} · ${c.job}</div>
                </div>
                <div style="display:flex; gap:12px; margin-bottom:25px;">
                    <a href="tel:${c.phone}" class="action-btn" style="background:#f0f9ff; color:var(--primary);"><i class="fa-solid fa-phone"></i> 立即拨号</a>
                    <div onclick="openForm(${c.id})" class="action-btn" style="background:#f8fafc; color:var(--dark); border:1px solid #eee;"><i class="fa-solid fa-pen-to-square"></i> 编辑档案</div>
                </div>
                <div style="background:#f8fafc; padding:20px; border-radius:20px; margin-bottom:20px;">
                    <div style="font-size:11px; font-weight:900; color:#94a3b8; margin-bottom:8px;">核心决策备忘 (MEMO)</div>
                    <div style="line-height:1.8; white-space:pre-wrap;">${c.demands || '无'}</div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div style="font-size:13px; color:var(--text-sub);"><b>微信：</b>${c.wechat || '未填'}</div>
                    <div style="font-size:13px; color:var(--text-sub);"><b>来源：</b>${c.source || '未知'}</div>
                    <div style="font-size:13px; color:var(--text-sub);"><b>生日：</b>${c.birthday || '未填'}</div>
                </div>
            </div>
        `;
    }

    function renderAI() {
        const container = document.getElementById('aiContainer');
        container.innerHTML = '';
        customers.slice(0, 5).forEach(c => {
            let advice = "建议保持例行联络，深化信任基础。";
            if(c.level.includes('⭐⭐⭐⭐⭐')) advice = "🔥 核心资产！建议本周安排线下拜访，锁定关键诉求。";
            if(c.demands.includes('价格')) advice = "⚠️ 警报：对方对价格敏感。沟通时应主推“长期降本增效”逻辑。";
            const div = document.createElement('div');
            div.style = "background:white; padding:20px; border-radius:25px; margin-bottom:15px; border-left:6px solid var(--dark);";
            div.innerHTML = `<div style="font-weight:900; color:var(--primary); margin-bottom:5px;">针对 ${c.name} 的策略：</div><div>${advice}</div>`;
            container.appendChild(div);
        });
    }

    function renderChart() {
        const stats = {};
        customers.forEach(c => stats[c.status] = (stats[c.status] || 0) + 1);
        const ctx = document.getElementById('statChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: Object.keys(stats), datasets: [{ data: Object.values(stats), backgroundColor: ['#2563eb','#f59e0b','#10b981','#ef4444'], borderWidth: 0 }] },
            options: { cutout: '70%', plugins: { legend: { position: 'bottom' } } }
        });
    }

    function openForm(id = null) {
        document.getElementById('editId').value = id || '';
        document.getElementById('delBtn').style.display = id ? 'block' : 'none';
        if(id) {
            const c = customers.find(x => x.id == id);
            ['name','gender','level','status','company','job','phone','wechat','source','birthday','demands'].forEach(k => document.getElementById(k).value = c[k] || '');
        } else {
            document.querySelectorAll('.input').forEach(i => i.value = '');
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function closeForm() { document.getElementById('modal').style.display = 'none'; }

    async function saveData() {
        const row = {
            name: document.getElementById('name').value,
            gender: document.getElementById('gender').value,
            level: document.getElementById('level').value,
            status: document.getElementById('status').value,
            company: document.getElementById('company').value,
            job: document.getElementById('job').value,
            phone: document.getElementById('phone').value,
            wechat: document.getElementById('wechat').value,
            source: document.getElementById('source').value,
            birthday: document.getElementById('birthday').value,
            demands: document.getElementById('demands').value
        };
        const id = document.getElementById('editId').value;
        if(id) await supabaseClient.from('customers').update(row).eq('id', id);
        else await supabaseClient.from('customers').insert([row]);
        await init(); closeForm(); switchTab('list');
    }

    async function deleteRecord() { if(confirm("抹除档案不可恢复，确认？")) { await supabaseClient.from('customers').delete().eq('id', document.getElementById('editId').value); await init(); closeForm(); switchTab('list'); } }
    function syncData() { alert("决策数据库已实时加密备份。"); }

    init();
</script>
</body>
</html>
