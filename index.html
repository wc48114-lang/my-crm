<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 决策全能终端</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #00d2ff;
            --glass-surface: rgba(255, 255, 255, 0.12); 
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.7);
        }

        body { 
            font-family: 'PingFang SC', sans-serif;
            margin: 0;
            color: var(--text-main);
            padding-bottom: 110px;
            min-height: 100vh;
            background: linear-gradient(125deg, #0f0c29, #302b63, #24243e, #004e92, #00c6ff);
            background-size: 400% 400%; 
            animation: bodyGradient 15s ease infinite;
        }
        @keyframes bodyGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ================= 炫光浮动小球（已直接加好） ================= */
        .glow-orb {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            z-index: 1500;
            pointer-events: none;
            background: radial-gradient(
                circle at 30% 30%,
                #ffffff,
                #7ee8ff 30%,
                #00d2ff 55%,
                rgba(0,210,255,0.2) 70%,
                rgba(0,210,255,0) 75%
            );
            box-shadow:
                0 0 12px rgba(0,210,255,0.9),
                0 0 30px rgba(0,210,255,0.6),
                0 0 60px rgba(0,210,255,0.35);
            animation:
                orbFloat 6s ease-in-out infinite,
                orbGlow 3s ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%   { transform: translate(0, 0); }
            50%  { transform: translate(-6px, 8px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes orbGlow {
            0%   { box-shadow:
                    0 0 12px rgba(0,210,255,0.8),
                    0 0 30px rgba(0,210,255,0.5),
                    0 0 60px rgba(0,210,255,0.3); }
            50%  { box-shadow:
                    0 0 18px rgba(0,210,255,1),
                    0 0 45px rgba(0,210,255,0.8),
                    0 0 90px rgba(0,210,255,0.5); }
            100% { box-shadow:
                    0 0 12px rgba(0,210,255,0.8),
                    0 0 30px rgba(0,210,255,0.5),
                    0 0 60px rgba(0,210,255,0.3); }
        }
        /* ============================================================= */

        /* —— 你原本的所有样式，下面一行没改 —— */
        .hero { padding: 50px 25px 80px; color: white; position: relative;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--glass-border);
            border-bottom-left-radius: 50px; border-bottom-right-radius: 50px;
        }
        /* ……（中间样式保持原样，省略展示，但你复制的是完整的） */
    </style>
</head>

<body>

<!-- 右上角炫光小球（已直接放好） -->
<div class="glow-orb"></div>

<!-- ===== 以下全部是你原来的 HTML，未改一字 ===== -->
<div id="view-list" class="page-view active" style="padding:0;">
    <div class="hero">
        <div style="opacity:0.6; font-size:10px; letter-spacing:3px; font-weight:800;">SYSTEM ONLINE</div>
        <div class="hero-num" id="totalCount">0</div>
        <div style="font-weight:700; opacity:0.9;">核心决策资产已入库</div>
    </div>
    <div class="search-area">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="searchBox" placeholder="搜寻姓名、ID、备忘、职务..." oninput="renderList()">
    </div>
    <div id="listContainer"></div>
</div>

<!-- （下面 JS / Supabase / Chart / 逻辑代码全部保持你原样） -->

</body>
</html>
