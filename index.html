<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 决策全能终端</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #00d2ff;
            --glass-surface: rgba(255, 255, 255, 0.08); 
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        /* 全屏高级流动背景 */
        body { 
            font-family: 'PingFang SC', sans-serif; margin: 0; color: var(--text-main); padding-bottom: 110px;
            min-height: 100vh;
            background: linear-gradient(125deg, #0f0c29, #302b63, #24243e, #004e92);
            background-size: 400% 400%; 
            animation: bodyGradient 15s ease infinite;
            overflow-x: hidden;
        }
        @keyframes bodyGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Hero区域布局优化：左侧数字，右侧状态 */
        .hero { 
            padding: 60px 25px 80px; position: relative;
            display: flex; justify-content: space-between; align-items: flex-end;
            overflow: hidden;
        }

        /* 灵动环境球装饰：填补右侧“1”的空白 */
        .hero::after {
            content: ""; position: absolute; top: -10%; right: -5%;
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(0,210,255,0.25) 0%, rgba(121,40,202,0.15) 50%, transparent 70%);
            filter: blur(35px); animation: floatBall 10s ease-in-out infinite; z-index: 1;
        }
        @keyframes floatBall { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-15px, 25px); } }

        .hero-left { position: relative; z-index: 2; }
        .hero-num { font-size: 75px; font-weight: 900; line-height: 1; margin-bottom: 5px; text-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        
        /* 右侧新增的实时状态展示 */
        .hero-right { 
            position: relative; z-index: 2; text-align: right; 
            background: rgba(255,255,255,0.08); padding: 12px 18px; border-radius: 22px;
            backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
            margin-bottom: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .hero-right span { display: block; font-size: 9px; font-weight: 800; letter-spacing: 1.5px; color: var(--primary); margin-bottom: 2px; }
        .hero-right b { font-size: 16px; color: white; letter-spacing: 1px; }

        .search-area { margin: -40px 20px 20px; position: relative; z-index: 10; }
        #searchBox { 
            width: 100%; padding: 18px 25px 18px 60px; border: none; border-radius: 22px; 
            background: rgba(255,255,255,0.12); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); color: white; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            font-size: 15px; outline: none; box-sizing: border-box; 
        }
        #searchBox::placeholder { color: rgba(255,255,255,0.4); }
        .search-icon { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: var(--primary); }

        .card { 
            background: var(--glass-surface); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            margin: 0 16px 15px; padding: 22px; border-radius: 32px; 
            border: 1px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .name { font-size: 24px; font-weight: 900; }
        .cust-id-tag { font-size: 10px; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; color: var(--text-sub); border: 1px solid var(--glass-border); }
        
        .memo-box { background: rgba(0, 0, 0, 0.15); padding: 15px; border-radius: 18px; font-size: 13px; color: rgba(255,255,255,0.8); border-left: 3px solid var(--primary); }

        .tab-bar { 
            position: fixed; bottom: 0; width: 100%; height: 90px; 
            background: rgba(15, 12, 41, 0.7); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            display: flex; align-items: center; z-index: 1000; border-top: 1px solid var(--glass-border); 
        }
        .tab-item { flex: 1; text-align: center; color: rgba(255,255,255,0.4); font-size: 10px; font-weight: 800; transition: 0.3s; }
        .tab-item.active { color: var(--primary); text-shadow: 0 0 10px rgba(0,210,255,0.5); }
        .tab-item i { font-size: 22px; margin-bottom: 4px; display: block; }
        .add-btn { 
            width: 62px; height: 62px; background: var(--primary); color: white; border-radius: 22px; 
            display: flex; align-items: center; justify-content: center; font-size: 26px; margin-top: -45px; 
            box-shadow: 0 10px 20px rgba(0, 210, 255, 0.4); border: 3px solid rgba(255,255,255,0.15);
        }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); display: none; z-index: 2000; align-items: flex-end; }
        .modal-content { 
            background: rgba(30, 30, 50, 0.9); backdrop-filter: blur(40px);
            width: 100%; border-radius: 40px 40px 0 0; padding: 30px; max-height: 90vh; overflow-y: auto; box-sizing: border-box; 
            border-top: 1px solid var(--glass-border); color: white;
        }
        .input { width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,0.15); border-radius: 15px; background: rgba(255,255,255,0.05); color: white; box-sizing: border-box; margin-top: 5px; outline: none; }
        .save-btn { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 20px; font-weight: 900; font-size: 16px; margin-top: 20px; }

        ::-webkit-scrollbar { display: none; }
        .page-view { display: none; }
        .page-view.active { display: block; }
    </style>
</head>
<body>

<div id="view-list" class="page-view active">
    <div class="hero">
        <div class="hero-left">
            <div style="opacity:0.6; font-size:10px; letter-spacing:3px; font-weight:800;">SYSTEM ONLINE</div>
            <div class="hero-num" id="totalCount">0</div>
            <div style="font-weight:700; opacity:0.9; font-size: 14px;">核心决策资源已就绪</div>
        </div>
        <div class="hero-right">
            <span>CORE STATUS</span>
            <b>RUNNING</b>
        </div>
    </div>
    
    <div class="search-area">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="searchBox" placeholder="搜寻姓名、ID、备注、职务..." oninput="renderList()">
    </div>
    <div id="listContainer"></div>
</div>

<div id="view-detail" class="page-view" style="padding: 20px;">
    <div onclick="switchTab('list')" style="font-weight:800; color:var(--text-sub); margin-bottom:20px;"><i class="fa-solid fa-arrow-left"></i> 返回档案库</div>
    <div id="detailContainer"></div>
</div>

<div class="tab-bar">
    <div class="tab-item active" id="tab-list" onclick="switchTab('list')"><i class="fa-solid fa-layer-group"></i><span>中枢</span></div>
    <div class="tab-item"><i class="fa-solid fa-brain"></i><span>军师</span></div>
    <div class="add-btn" onclick="openForm()"><i class="fa-solid fa-plus"></i></div>
    <div class="tab-item"><i class="fa-solid fa-chart-pie"></i><span>穿透</span></div>
    <div class="tab-item" onclick="syncData()"><i class="fa-solid fa-cloud-arrow-up"></i><span>同步</span></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h2 style="margin:0; font-weight:900;">档案维护</h2>
            <i class="fa-solid fa-circle-xmark" onclick="closeForm()" style="font-size:28px; opacity:0.5;"></i>
        </div>
        <input type="hidden" id="editId">
        <div style="margin-bottom:15px;"><label style="font-size:12px; opacity:0.6;">姓名</label><input type="text" id="name" class="input"></div>
        <div style="margin-bottom:15px;"><label style="font-size:12px; opacity:0.6;">公司/职务</label><input type="text" id="company" class="input"></div>
        <div style="margin-bottom:15px;"><label style="font-size:12px; opacity:0.6;">备忘</label><textarea id="demands" rows="4" class="input"></textarea></div>
        <button class="save-btn" onclick="saveData()">确认同步</button>
    </div>
</div>

<script>
    // 保持您的所有数据库配置不变
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];

    async function init() {
        const { data } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
        customers = data || [];
        renderList();
    }

    function switchTab(view) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
        window.scrollTo(0,0);
    }

    function renderList() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        const list = customers.filter(c => String(c.name).toLowerCase().includes(kw) || String(c.company).toLowerCase().includes(kw));
        document.getElementById('totalCount').innerText = list.length;
        list.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => showDetail(c.id);
            div.innerHTML = `
                <div class="card-header"><span class="name">${c.name}</span><span class="cust-id-tag">a1</span></div>
                <div style="font-size:13px; color:var(--text-sub); margin-bottom:12px;">${c.company || '未知机构'}</div>
                <div class="memo-box">${c.demands ? c.demands.substring(0, 40) + '...' : '暂无详细备忘信息'}</div>
            `;
            container.appendChild(div);
        });
    }

    function showDetail(id) {
        const c = customers.find(x => x.id == id);
        switchTab('detail');
        document.getElementById('detailContainer').innerHTML = `
            <div class="card" style="margin:0; padding:30px;">
                <h2 style="font-size:32px; margin:0;">${c.name}</h2>
                <p style="color:var(--primary); font-weight:800;">${c.company}</p>
                <div class="memo-box" style="margin:20px 0; background:rgba(255,255,255,0.05);">${c.demands || '无内容'}</div>
                <button onclick="switchTab('list')" style="width:100%; padding:15px; border-radius:15px; border:1px solid var(--glass-border); background:none; color:white;">返回</button>
            </div>
        `;
    }

    function openForm() { document.getElementById('modal').style.display = 'flex'; }
    function closeForm() { document.getElementById('modal').style.display = 'none'; }

    async function saveData() {
        const row = { name: document.getElementById('name').value, company: document.getElementById('company').value, demands: document.getElementById('demands').value };
        const { error } = await supabaseClient.from('customers').insert([row]);
        if(!error) { init(); closeForm(); }
    }

    function syncData() { init(); alert("同步成功"); }
    init();
</script>
</body>
</html>
