<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 顶级决策系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0f172a; --primary: #2563eb; --bg: #f8fafc; --text-main: #1e293b; --text-sub: #64748b; }
        body { font-family: 'PingFang SC', sans-serif; background: var(--bg); margin: 0; color: var(--text-main); padding-bottom: 100px; }
        .hero { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 60px 25px 80px; color: white; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; position: relative; }
        .hero-num { font-size: 70px; font-weight: 900; line-height: 1; }
        .card { background: white; margin: 16px; padding: 22px; border-radius: 35px; box-shadow: 0 10px 25px rgba(0,0,0,0.02); border: 1px solid rgba(255,255,255,0.8); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 2000; align-items: flex-end; backdrop-filter: blur(5px); }
        .modal-content { background: white; width: 100%; border-radius: 45px 45px 0 0; padding: 30px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .input { width: 100%; padding: 16px; border: 2px solid #f1f5f9; border-radius: 18px; background: #f8fafc; margin-bottom: 12px; font-size: 15px; outline: none; box-sizing: border-box; transition: 0.3s; }
        .input:focus { border-color: var(--primary); background: white; }
        .save-btn { width: 100%; padding: 22px; background: var(--dark); color: white; border: none; border-radius: 25px; font-weight: 900; font-size: 17px; box-shadow: 0 15px 30px rgba(15,23,42,0.2); }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 95px; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); display: flex; align-items: center; border-top: 1px solid rgba(0,0,0,0.05); }
        .add-btn { width: 65px; height: 65px; background: var(--primary); color: white; border-radius: 22px; display: flex; align-items: center; justify-content: center; margin: -50px auto 0; border: 6px solid var(--bg); font-size: 28px; box-shadow: 0 10px 20px rgba(37,99,235,0.3); }
    </style>
</head>
<body>

<div id="view-list">
    <div class="hero">
        <div style="opacity:0.6; font-size:11px; letter-spacing:2px; margin-bottom:5px;">STRATEGIC ASSETS</div>
        <div class="hero-num" id="totalCount">0</div>
        <div style="font-weight:700; font-size:18px;">核心档案同步就绪</div>
    </div>
    <div id="listContainer" style="margin-top: -35px; position: relative; z-index: 10;"></div>
</div>

<div id="view-detail" style="display:none; padding:20px;">
    <div onclick="switchTab('list')" style="padding:15px 0; color:var(--text-sub); font-weight:700;"><i class="fa-solid fa-chevron-left"></i> 返回</div>
    <div id="detailContainer"></div>
</div>

<div class="tab-bar">
    <div style="flex:1; text-align:center; color:var(--primary);" onclick="location.reload()"><i class="fa-solid fa-house"></i></div>
    <div class="add-btn" onclick="openForm()"><i class="fa-solid fa-plus"></i></div>
    <div style="flex:1; text-align:center; color:var(--text-sub);"><i class="fa-solid fa-chart-pie"></i></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 style="margin:0 0 20px; font-weight:900;">档案更新</h2>
        <input type="hidden" id="editId">
        <input type="text" id="cust_id_form" class="input" placeholder="档案编号 (点击生成)" readonly style="background:#eee; color:#666;">
        <div class="input-group">
            <input type="text" id="name" class="input" placeholder="姓名 (必填)">
            <select id="gender" class="input"><option value="男">男</option><option value="女">女</option></select>
        </div>
        <div class="input-group">
            <input type="text" id="company" class="input" placeholder="公司 / 机构">
            <input type="text" id="job" class="input" placeholder="职务">
        </div>
        <input type="text" id="phone" class="input" placeholder="联系电话">
        <input type="text" id="wechat" class="input" placeholder="微信号">
        <input type="email" id="email" class="input" placeholder="电子邮箱">
        <input type="text" id="address" class="input" placeholder="办公地址 / 地区">
        <div class="input-group">
            <input type="date" id="birthday" class="input">
            <input type="text" id="source" class="input" placeholder="获客来源">
        </div>
        <textarea id="demands" rows="3" class="input" placeholder="核心备忘录..."></textarea>
        <button class="save-btn" onclick="saveData()">同步至决策云端</button>
        <button onclick="closeForm()" style="width:100%; background:none; border:none; color:var(--text-sub); margin-top:15px; font-weight:700;">取消操作</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];

    async function init() {
        const { data, error } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
        if(error) return;
        customers = data;
        document.getElementById('totalCount').innerText = data.length;
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        data.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => showDetail(c.id);
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <div style="font-size:10px; color:var(--text-sub); margin-bottom:4px;">${c.cust_id || 'ID-NEW'}</div>
                        <b style="font-size:22px;">${c.name}</b>
                    </div>
                    <div style="background:#f1f5f9; padding:5px 12px; border-radius:10px; font-size:12px; font-weight:700;">${c.company || '个人'}</div>
                </div>
                <div style="margin-top:12px; color:var(--primary); font-size:13px; font-weight:700;"><i class="fa-solid fa-location-dot"></i> ${c.address || '暂未标注地区'}</div>
            `;
            container.appendChild(div);
        });
    }

    function switchTab(tab) {
        document.getElementById('view-list').style.display = tab === 'list' ? 'block' : 'none';
        document.getElementById('view-detail').style.display = tab === 'detail' ? 'block' : 'none';
    }

    function showDetail(id) {
        const c = customers.find(x => x.id == id);
        switchTab('detail');
        document.getElementById('detailContainer').innerHTML = `
            <div style="text-align:center; margin-bottom:30px;">
                <div style="font-size:12px; color:var(--text-sub);">档案编号: ${c.cust_id || 'SN-100' + c.id}</div>
                <h1 style="font-size:40px; margin:10px 0; font-weight:900;">${c.name}</h1>
                <div style="color:var(--primary); font-weight:800;">${c.company || '-'} · ${c.job || '-'}</div>
            </div>

            <div style="display:flex; gap:10px; margin-bottom:25px;">
                <a href="tel:${c.phone}" style="flex:1; background:var(--primary); color:white; text-align:center; padding:18px; border-radius:20px; text-decoration:none; font-weight:900;"><i class="fa-solid fa-phone"></i> 拨号</a>
                <div onclick="openForm(${c.id})" style="flex:1; background:white; border:2px solid #e2e8f0; text-align:center; padding:18px; border-radius:20px; font-weight:900;"><i class="fa-solid fa-pen"></i> 编辑</div>
            </div>

            <div style="background:var(--dark); color:white; padding:25px; border-radius:30px; margin-bottom:20px; line-height:1.6; font-size:15px;">
                <div style="font-size:10px; color:#94a3b8; margin-bottom:8px; letter-spacing:1px;">INTEL MEMO / 备注</div>
                ${c.demands || '暂无决策备忘录'}
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                <div style="background:white; padding:15px; border-radius:20px;">
                    <span style="font-size:10px; color:var(--text-sub); display:block;">微信</span>
                    <b style="font-size:14px;">${c.wechat || '-'}</b>
                </div>
                <div style="background:white; padding:15px; border-radius:20px;">
                    <span style="font-size:10px; color:var(--text-sub); display:block;">邮箱</span>
                    <b style="font-size:14px; word-break:break-all;">${c.email || '-'}</b>
                </div>
                <div style="background:white; padding:15px; border-radius:20px; grid-column: span 2;">
                    <span style="font-size:10px; color:var(--text-sub); display:block;">办公地址</span>
                    <b style="font-size:14px;">${c.address || '-'}</b>
                </div>
                <div style="background:white; padding:15px; border-radius:20px;">
                    <span style="font-size:10px; color:var(--text-sub); display:block;">来源</span>
                    <b style="font-size:14px;">${c.source || '-'}</b>
                </div>
                <div style="background:white; padding:15px; border-radius:20px;">
                    <span style="font-size:10px; color:var(--text-sub); display:block;">生日</span>
                    <b style="font-size:14px;">${c.birthday || '-'}</b>
                </div>
            </div>
        `;
    }

    function openForm(id = null) {
        document.querySelectorAll('.input').forEach(i => i.value = '');
        if(id) {
            const c = customers.find(x => x.id == id);
            document.getElementById('editId').value = c.id;
            document.getElementById('cust_id_form').value = c.cust_id || 'ID-' + Math.random().toString(36).substr(2, 5).toUpperCase();
            document.getElementById('name').value = c.name;
            document.getElementById('company').value = c.company;
            document.getElementById('job').value = c.job;
            document.getElementById('phone').value = c.phone;
            document.getElementById('wechat').value = c.wechat;
            document.getElementById('email').value = c.email;
            document.getElementById('address').value = c.address;
            document.getElementById('source').value = c.source;
            document.getElementById('birthday').value = c.birthday;
            document.getElementById('demands').value = c.demands;
            document.getElementById('gender').value = c.gender || '男';
        } else {
            document.getElementById('editId').value = '';
            document.getElementById('cust_id_form').value = 'ID-' + Math.random().toString(36).substr(2, 5).toUpperCase();
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function closeForm() { document.getElementById('modal').style.display = 'none'; }

    async function saveData() {
        const id = document.getElementById('editId').value;
        const name = document.getElementById('name').value;
        if(!name) { alert("姓名必填"); return; }

        const row = {
            cust_id: document.getElementById('cust_id_form').value,
            name: name,
            company: document.getElementById('company').value,
            job: document.getElementById('job').value,
            phone: document.getElementById('phone').value,
            wechat: document.getElementById('wechat').value,
            email: document.getElementById('email').value,
            address: document.getElementById('address').value,
            source: document.getElementById('source').value,
            birthday: document.getElementById('birthday').value,
            demands: document.getElementById('demands').value,
            gender: document.getElementById('gender').value
        };

        const { error } = id 
            ? await supabaseClient.from('customers').update(row).eq('id', id)
            : await supabaseClient.from('customers').insert([row]);

        if(!error) {
            alert("同步成功");
            closeForm();
            init();
            switchTab('list');
        } else {
            alert("同步失败：" + error.message);
        }
    }

    init();
</script>
</body>
</html>
