<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>纵横 · 决策中心 CRM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root { --primary: #6366f1; --accent: #f59e0b; --text-main: #1e293b; --text-sub: #64748b; --bg-light: #f8fafc; --bg-dark: #0f172a; }
        body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding-bottom: 100px; background: var(--bg-light); color: var(--text-main); }
        
        /* 顶部 Header */
        .app-header { background: linear-gradient(135deg, var(--bg-dark) 0%, #334155 100%); padding: 40px 20px 30px; border-radius: 0 0 40px 40px; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .sync-status { font-size: 12px; opacity: 0.8; margin-top: 10px; }

        /* 搜索框 */
        #searchBox { width: calc(100% - 40px); margin: -25px 20px 20px; padding: 18px 25px; border: none; border-radius: 28px; background: white; box-shadow: 0 15px 40px rgba(0,0,0,0.1); font-size: 16px; outline: none; box-sizing: border-box; position: relative; z-index: 10; }

        /* 卡片设计 */
        .customer-card { background: white; border-radius: 30px; padding: 25px; margin: 0 18px 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.7); transition: 0.3s; cursor: pointer; }
        .customer-card:active { transform: scale(0.97); }
        .card-name { font-size: 24px; font-weight: 800; }
        .stars-container { color: var(--accent); display: flex; gap: 2px; }
        
        /* 动效星星 */
        .star-unit { opacity: 0; transform: scale(0.5); animation: starPop 0.4s forwards; }
        @keyframes starPop { to { opacity: 1; transform: scale(1); } }

        .demand-summary { background: #fffbeb; padding: 15px; border-radius: 20px; font-size: 14px; color: #92400e; margin-top: 15px; border-left: 5px solid #fbbf24; }

        /* 底部导航栏 */
        .app-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-dark); height: 80px; display: flex; justify-content: space-around; align-items: center; z-index: 100; border-top-left-radius: 30px; border-top-right-radius: 30px; }
        .nav-item { color: #94a3b8; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .fab-button { width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); border: 5px solid var(--bg-light); box-shadow: 0 10px 25px rgba(99,102,241,0.4); }

        /* 模态框 */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: flex-end; backdrop-filter: blur(10px); }
        .modal.show { display: flex; }
        .modal-content { background: white; width: 100%; border-radius: 35px 35px 0 0; padding: 30px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        input, select, textarea { width: 100%; padding: 15px; border: 1px solid #e2e8f0; border-radius: 16px; background: #f8fafc; margin-bottom: 15px; box-sizing: border-box; }
        
        /* 详情页 */
        #customerDetailView { padding: 20px; display: none; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .info-item { background: #eef2ff; padding: 15px; border-radius: 15px; font-size: 13px; }
    </style>
</head>
<body>

<div id="listView">
    <div class="app-header">
        <div style="font-size: 24px; font-weight: 900;">纵横 · 决策中心</div>
        <div class="sync-status" id="syncStatus">📡 正在连接云端...</div>
    </div>
    <input type="text" id="searchBox" placeholder="快速搜寻目标...">
    <div id="customerList"></div>
</div>

<div id="dashboardView" style="display:none; padding: 20px;">
    <h2 style="text-align:center">资产数据看板</h2>
    <canvas id="statusChart" style="max-height: 300px;"></canvas>
    <div id="statsInfo" style="margin-top:20px; text-align:center; color:var(--text-sub)"></div>
</div>

<div id="customerDetailView">
    <button onclick="switchView('list')" style="border:none; background:none; color:var(--primary); font-weight:bold; margin-bottom:20px;">← 返回列表</button>
    <div id="detailContent"></div>
    <button onclick="openModalForEdit()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:15px; margin-top:20px;">编辑档案</button>
</div>

<div class="app-nav">
    <div class="nav-item active" id="navHome" onclick="switchView('list')"><i class="fas fa-users"></i><span>列表</span></div>
    <div class="nav-item" id="navChart" onclick="switchView('dashboard')"><i class="fas fa-chart-pie"></i><span>统计</span></div>
</div>
<div class="fab-button" onclick="openModal()">+</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 id="modalTitle">档案录入</h3>
            <span onclick="closeModal()" style="font-size:24px; cursor:pointer">×</span>
        </div>
        <input type="hidden" id="editId">
        <label>姓名</label><input type="text" id="name">
        <label>手机号</label><input type="tel" id="phone">
        <label>状态</label>
        <select id="status">
            <option value="💡 初步接触">初步接触</option>
            <option value="🤝 正式签约">正式签约</option>
            <option value="⏸️ 暂时搁置">暂时搁置</option>
        </select>
        <label>核心诉求</label><textarea id="demands" rows="3"></textarea>
        <button onclick="saveCustomer()" id="saveBtn" style="width:100%; padding:18px; background:var(--primary); color:white; border:none; border-radius:18px; font-weight:bold;">同步云端</button>
        <button id="delBtn" onclick="removeCustomer()" style="width:100%; color:red; background:none; border:none; margin-top:15px; display:none;">🗑️ 删除档案</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];
    let statusChartInstance = null;
    let currentId = null;

    async function init() {
        try {
            const { data, error } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            customers = data || [];
            document.getElementById('syncStatus').innerText = "✅ 云端已同步";
            renderList();
        } catch (err) { document.getElementById('syncStatus').innerText = "❌ 连接失败"; }
    }

    function renderList() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('customerList');
        container.innerHTML = '';
        const filtered = customers.filter(c => c.name.toLowerCase().includes(kw) || (c.demands && c.demands.toLowerCase().includes(kw)));
        
        filtered.forEach(c => {
            const div = document.createElement('div');
            div.className = 'customer-card';
            div.onclick = () => openDetail(c.id);
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="card-name">${c.name}</span>
                    <div class="stars-container"><span class="star-unit">⭐⭐⭐⭐⭐</span></div>
                </div>
                <div style="margin-top:10px; font-size:12px; color:var(--text-sub)">${c.status}</div>
                <div class="demand-summary">${c.demands || '暂无备注'}</div>
            `;
            container.appendChild(div);
        });
    }

    function switchView(view) {
        document.getElementById('listView').style.display = view === 'list' ? 'block' : 'none';
        document.getElementById('dashboardView').style.display = view === 'dashboard' ? 'block' : 'none';
        document.getElementById('customerDetailView').style.display = 'none';
        document.getElementById('navHome').classList.toggle('active', view === 'list');
        document.getElementById('navChart').classList.toggle('active', view === 'dashboard');
        if(view === 'dashboard') renderChart();
    }

    function openDetail(id) {
        currentId = id;
        const c = customers.find(x => x.id == id);
        document.getElementById('listView').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'none';
        const detail = document.getElementById('customerDetailView');
        detail.style.display = 'block';
        document.getElementById('detailContent').innerHTML = `
            <h1 style="font-size:32px; margin-bottom:5px;">${c.name}</h1>
            <div style="color:var(--primary); font-weight:bold; margin-bottom:20px;">${c.status}</div>
            <div class="info-grid">
                <div class="info-item">📞 电话：${c.phone || '未填写'}</div>
                <div class="info-item">🏢 公司：${c.company || '未填写'}</div>
            </div>
            <div style="margin-top:20px; padding:20px; background:white; border-radius:20px;">
                <h4 style="margin-top:0">核心诉求</h4>
                <p style="color:var(--text-sub); line-height:1.6">${c.demands || '暂无内容'}</p>
            </div>
        `;
    }

    function renderChart() {
        const stats = {};
        customers.forEach(c => stats[c.status] = (stats[c.status] || 0) + 1);
        const ctx = document.getElementById('statusChart').getContext('2d');
        if(statusChartInstance) statusChartInstance.destroy();
        statusChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(stats),
                datasets: [{ data: Object.values(stats), backgroundColor: ['#6366f1', '#f59e0b', '#10b981', '#ef4444'] }]
            },
            options: { plugins: { legend: { position: 'bottom' } } }
        });
        document.getElementById('statsInfo').innerText = `目前共有 ${customers.length} 位核心伙伴`;
    }

    function openModal() { document.getElementById('editId').value = ''; document.getElementById('modalTitle').innerText = '档案录入'; document.getElementById('delBtn').style.display = 'none'; document.getElementById('modal').classList.add('show'); }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }
    function openModalForEdit() {
        const c = customers.find(x => x.id == currentId);
        document.getElementById('editId').value = c.id;
        document.getElementById('name').value = c.name;
        document.getElementById('phone').value = c.phone || '';
        document.getElementById('status').value = c.status;
        document.getElementById('demands').value = c.demands || '';
        document.getElementById('modalTitle').innerText = '修正档案';
        document.getElementById('delBtn').style.display = 'block';
        document.getElementById('modal').classList.add('show');
    }

    async function saveCustomer() {
        const name = document.getElementById('name').value;
        if(!name) return alert("姓名必填");
        const id = document.getElementById('editId').value;
        const row = { name, phone: document.getElementById('phone').value, status: document.getElementById('status').value, demands: document.getElementById('demands').value };
        
        try {
            if(id) await supabaseClient.from('customers').update(row).eq('id', id);
            else await supabaseClient.from('customers').insert([row]);
            await init(); closeModal(); switchView('list');
        } catch (e) { alert("操作失败"); }
    }

    async function removeCustomer() {
        if(confirm("确定抹除该档案？")) {
            await supabaseClient.from('customers').delete().eq('id', document.getElementById('editId').value);
            await init(); closeModal(); switchView('list');
        }
    }

    document.getElementById('searchBox').oninput = renderList;
    init();
</script>
</body>
</html>
