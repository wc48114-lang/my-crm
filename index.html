<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 决策全能终端</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #00d2ff; 
            --glass-surface: rgba(255, 255, 255, 0.12); 
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.7);
        }

        /* 背景流光动画 */
        body { 
            font-family: 'PingFang SC', sans-serif; margin: 0; color: var(--text-main); padding-bottom: 110px;
            min-height: 100vh;
            background: linear-gradient(125deg, #0f0c29, #302b63, #24243e, #004e92, #00c6ff);
            background-size: 400% 400%; 
            animation: bodyGradient 15s ease infinite;
            overflow-x: hidden;
        }
        @keyframes bodyGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 【核心新增：真正的浮动炫光球】 */
        .floating-glow {
            position: fixed; width: 100vw; height: 100vh; top: 0; left: 0;
            pointer-events: none; z-index: 1; /* 放在背景之上，内容之下 */
        }
        .orb {
            position: absolute; border-radius: 50%;
            filter: blur(60px); opacity: 0.6;
            animation: orbFloat 12s infinite ease-in-out;
        }
        .orb-1 { width: 200px; height: 200px; background: #00d2ff; top: 10%; right: -50px; animation-delay: 0s; }
        .orb-2 { width: 150px; height: 150px; background: #7928ca; top: 40%; left: -30px; animation-delay: -4s; }
        .orb-3 { width: 180px; height: 180px; background: #ff0080; bottom: 20%; right: 10%; animation-delay: -8s; }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-50px, 80px) scale(1.2); }
            66% { transform: translate(30px, -40px) scale(0.8); }
        }

        /* Hero 区域保持原状，确保内容层级在光球之上 */
        .hero { 
            padding: 50px 25px 80px; color: white; position: relative; z-index: 2;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--glass-border);
            border-bottom-left-radius: 50px; border-bottom-right-radius: 50px;
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .hero-num { font-size: 65px; font-weight: 900; letter-spacing: -2px; text-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* 【位置1：改为中文面板】 */
        .status-panel {
            background: rgba(255, 255, 255, 0.1); padding: 12px 18px; border-radius: 20px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); text-align: right;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .status-panel span { display: block; font-size: 10px; font-weight: 800; color: var(--primary); letter-spacing: 2px; margin-bottom: 2px; }
        .status-panel b { font-size: 16px; color: white; }

        /* 搜索区域 */
        .search-area { margin: -40px 20px 20px; position: relative; z-index: 10; }
        #searchBox { 
            width: 100%; padding: 20px 25px 20px 60px; border: none; border-radius: 25px; 
            background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); font-size: 16px; outline: none; box-sizing: border-box; 
        }
        #searchBox::placeholder { color: rgba(255,255,255,0.5); }
        .search-icon { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: var(--primary); }

        /* 卡片与其它样式完全保留原版 */
        .card { 
            background: var(--glass-surface); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            margin: 0 16px 18px; padding: 22px; border-radius: 35px; 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); position: relative; border: 1px solid var(--glass-border); z-index: 2;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .name { font-size: 24px; font-weight: 900; }
        .cust-id-tag { font-size: 10px; font-family: monospace; background: rgba(255, 255, 255, 0.15); padding: 2px 8px; border-radius: 5px; border: 1px solid var(--glass-border); }
        .memo-box { background: rgba(255, 255, 255, 0.08); padding: 18px; border-radius: 20px; font-size: 14px; line-height: 1.6; border-left: 4px solid var(--primary); color: rgba(255,255,255,0.85); }

        .page-view { display: none; padding: 20px; position: relative; z-index: 2; }
        .page-view.active { display: block; }
        
        .tab-bar { 
            position: fixed; bottom: 0; width: 100%; height: 95px; background: rgba(20, 20, 40, 0.4); 
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            display: flex; align-items: center; z-index: 1000; border-top: 1px solid var(--glass-border); 
        }
        .tab-item { flex: 1; text-align: center; color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 800; }
        .tab-item.active { color: var(--primary); text-shadow: 0 0 15px rgba(0, 210, 255, 0.6); }
        .tab-item i { font-size: 24px; margin-bottom: 4px; display: block; }
        .add-btn { 
            width: 65px; height: 65px; background: var(--primary); color: white; border-radius: 22px; 
            display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -45px; 
            box-shadow: 0 10px 25px rgba(0, 210, 255, 0.5); border: 4px solid rgba(255,255,255,0.1);
        }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(15px); display: none; z-index: 2000; align-items: flex-end; }
        .modal-content { 
            background: rgba(30, 30, 50, 0.85); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            width: 100%; border-radius: 45px 45px 0 0; padding: 30px; max-height: 90vh; overflow-y: auto; box-sizing: border-box; color: white;
        }
        .input { width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,0.2); border-radius: 15px; background: rgba(255,255,255,0.08); color: white; box-sizing: border-box; margin-top: 5px; outline: none; }
        .save-btn { width: 100%; padding: 20px; background: var(--primary); color: white; border: none; border-radius: 22px; font-weight: 900; font-size: 17px; margin-top: 15px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        label { font-size: 11px; color: var(--text-sub); font-weight: 900; }
    </style>
</head>
<body>

<div class="floating-glow">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div id="view-list" class="page-view active" style="padding:0;">
    <div class="hero">
        <div>
            <div style="opacity:0.6; font-size:10px; letter-spacing:3px; font-weight:800;">系统在线</div>
            <div class="hero-num" id="totalCount">0</div>
            <div style="font-weight:700; opacity:0.9;">核心决策资产已入库</div>
        </div>
        <div class="status-panel">
            <span>核心状态</span>
            <b>正在运行</b>
        </div>
    </div>
    <div class="search-area">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="searchBox" placeholder="搜寻姓名、ID、备忘、职务..." oninput="renderList()">
    </div>
    <div id="listContainer"></div>
</div>

<div id="view-detail" class="page-view">
    <div onclick="switchTab('list')" style="font-weight:800; color:var(--text-sub); margin-bottom:20px; cursor:pointer;"><i class="fa-solid fa-arrow-left"></i> 返回档案库</div>
    <div id="detailContainer"></div>
</div>

<div id="view-ai" class="page-view">
    <h1 style="font-weight:900; color:white; margin-bottom:25px;">AI 军师建议</h1>
    <div id="aiContainer"></div>
</div>

<div id="view-stats" class="page-view">
    <h1 style="font-weight:900; color:white; margin-bottom:25px;">资源分布透视</h1>
    <div style="background:var(--glass-surface); backdrop-filter:blur(30px); padding:20px; border-radius:30px;"><canvas id="statChart"></canvas></div>
</div>

<div class="tab-bar">
    <div class="tab-item active" id="tab-list" onclick="switchTab('list')"><i class="fa-solid fa-layer-group"></i><span>中枢</span></div>
    <div class="tab-item" id="tab-ai" onclick="switchTab('ai')"><i class="fa-solid fa-brain"></i><span>军师</span></div>
    <div class="add-btn" onclick="openForm()"><i class="fa-solid fa-plus"></i></div>
    <div class="tab-item" id="tab-stats" onclick="switchTab('stats')"><i class="fa-solid fa-chart-pie"></i><span>穿透</span></div>
    <div class="tab-item" onclick="syncData()"><i class="fa-solid fa-cloud-arrow-up"></i><span>同步</span></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h2 style="margin:0; font-weight:900;">档案维护</h2>
            <i class="fa-solid fa-circle-xmark" onclick="closeForm()" style="font-size:28px; color:rgba(255,255,255,0.5);"></i>
        </div>
        <input type="hidden" id="editId">
        <div><label>序列号</label><input type="text" id="cust_id" class="input" readonly style="opacity:0.5;"></div>
        <div class="grid">
            <div><label>姓名</label><input type="text" id="name" class="input"></div>
            <div><label>性别</label><select id="gender" class="input"><option>🚹 男</option><option>🚺 女</option></select></div>
        </div>
        <div class="grid">
            <div><label>级别</label><select id="level" class="input"><option>⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select></div>
            <div><label>状态</label><select id="status" class="input"><option>💡 初步接触</option><option>🤝 正式签约</option><option>⏸️ 暂时搁置</option></select></div>
        </div>
        <div class="grid">
            <div><label>公司</label><input type="text" id="company" class="input"></div>
            <div><label>职务</label><input type="text" id="job" class="input"></div>
        </div>
        <div class="grid">
            <div><label>电话</label><input type="tel" id="phone" class="input"></div>
            <div><label>微信</label><input type="text" id="wechat" class="input"></div>
        </div>
        <div><label>核心决策备忘</label><textarea id="demands" rows="3" class="input"></textarea></div>
        <button class="save-btn" onclick="saveData()">确 认 同 步</button>
        <button id="delBtn" onclick="deleteRecord()" style="width:100%; background:none; border:none; color:#ff4d4d; margin-top:15px; font-weight:800; display:none;">彻底移除</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];
    let myChart = null;

    async function init() {
        const { data } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
        customers = data || [];
        renderList();
    }

    function switchTab(view) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
        if(document.getElementById('tab-' + view)) document.getElementById('tab-' + view).classList.add('active');
        if(view === 'ai') renderAI();
        if(view === 'stats') renderChart();
        window.scrollTo(0, 0);
    }

    function renderList() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        const list = customers.filter(c => Object.values(c).some(v => String(v).toLowerCase().includes(kw)));
        document.getElementById('totalCount').innerText = list.length;
        list.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => showDetail(c.id);
            div.innerHTML = `
                <div class="card-header"><span class="name">${c.name}</span><span class="cust-id-tag">${c.cust_id || 'a1'}</span></div>
                <div style="font-size:13px; color:var(--text-sub); margin-bottom:8px;">${c.company} · ${c.job}</div>
                <div class="memo-box">${c.demands ? c.demands.substring(0, 30) + '...' : '点击完善情报'}</div>
            `;
            container.appendChild(div);
        });
    }

    function showDetail(id) {
        const c = customers.find(x => x.id == id);
        switchTab('detail');
        document.getElementById('detailContainer').innerHTML = `
            <div class="card" style="margin:0; padding:30px;">
                <div style="text-align:center; margin-bottom:20px;">
                    <h2 style="font-size:32px; margin:0;">${c.name}</h2>
                    <div style="color:var(--primary); font-weight:800;">${c.company} · ${c.job}</div>
                </div>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <a href="tel:${c.phone}" style="flex:1; text-align:center; padding:15px; background:var(--primary); color:white; border-radius:15px; text-decoration:none; font-weight:800;">拨号</a>
                    <div onclick="openForm(${c.id})" style="flex:1; text-align:center; padding:15px; background:rgba(255,255,255,0.1); border:1px solid var(--glass-border); color:white; border-radius:15px; font-weight:800;">编辑</div>
                </div>
                <div class="memo-box" style="margin-bottom:20px;">${c.demands || '无备忘'}</div>
            </div>
        `;
    }

    function openForm(id = null) {
        document.getElementById('editId').value = id || '';
        document.getElementById('delBtn').style.display = id ? 'block' : 'none';
        const fields = ['cust_id','name','gender','level','status','company','job','phone','wechat','demands'];
        if(id) {
            const c = customers.find(x => x.id == id);
            fields.forEach(f => document.getElementById(f).value = c[f] || '');
        } else {
            fields.forEach(f => document.getElementById(f).value = '');
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function closeForm() { document.getElementById('modal').style.display = 'none'; }

    async function saveData() {
        const id = document.getElementById('editId').value;
        const row = {
            name: document.getElementById('name').value,
            gender: document.getElementById('gender').value,
            level: document.getElementById('level').value,
            status: document.getElementById('status').value,
            company: document.getElementById('company').value,
            job: document.getElementById('job').value,
            phone: document.getElementById('phone').value,
            wechat: document.getElementById('wechat').value,
            demands: document.getElementById('demands').value
        };
        const { error } = id ? await supabaseClient.from('customers').update(row).eq('id', id) : await supabaseClient.from('customers').insert([row]);
        if(!error) { init(); closeForm(); switchTab('list'); }
    }

    function renderAI() {
        const container = document.getElementById('aiContainer'); container.innerHTML = '';
        customers.slice(0, 3).forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<div style="font-weight:900; color:var(--primary);">攻坚建议: ${c.name}</div><div style="font-size:13px; margin-top:10px;">建议深度跟进其决策备忘中的核心诉求。</div>`;
            container.appendChild(div);
        });
    }

    function renderChart() {
        const stats = {}; customers.forEach(c => stats[c.status] = (stats[c.status] || 0) + 1);
        const ctx = document.getElementById('statChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: Object.keys(stats), datasets: [{ data: Object.values(stats), backgroundColor: ['#00d2ff','#7928ca','#ff0080','#fdbb2d'], borderWidth: 0 }] },
            options: { plugins: { legend: { position: 'bottom', labels: { color: 'white' } } } }
        });
    }

    async function deleteRecord() { if(confirm("确认删除？")) { await supabaseClient.from('customers').delete().eq('id', document.getElementById('editId').value); init(); closeForm(); switchTab('list'); } }
    function syncData() { init(); alert("同步完成"); }
    init();
</script>
</body>
</html>
