<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 决策全能终端</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #00d2ff;
            --glass-surface: rgba(255, 255, 255, 0.08); 
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.6);
        }

        /* 1. 全屏流动背景 */
        body { 
            font-family: 'PingFang SC', sans-serif; margin: 0; color: var(--text-main); padding-bottom: 110px;
            min-height: 100vh;
            background: linear-gradient(125deg, #0f0c29, #302b63, #24243e, #004e92, #00d2ff);
            background-size: 400% 400%; 
            animation: bodyGradient 15s ease infinite;
            overflow-x: hidden;
        }
        @keyframes bodyGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 2. 炫光浮动小球（核心特效） */
        .glow-sphere {
            position: absolute; top: -50px; right: -30px;
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(0,210,255,0.4) 0%, rgba(121,40,202,0.2) 40%, transparent 70%);
            filter: blur(40px);
            z-index: 1; /* 确保在背景之上，内容之下 */
            animation: floatBall 8s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes floatBall {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            50% { transform: translate(-30px, 40px) scale(1.1); opacity: 0.9; }
        }

        /* 布局 */
        .hero { padding: 60px 25px 80px; position: relative; display: flex; justify-content: space-between; align-items: flex-end; z-index: 2; }
        .hero-num { font-size: 75px; font-weight: 900; line-height: 1; text-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        
        .hero-right { 
            background: rgba(255,255,255,0.12); padding: 12px 18px; border-radius: 22px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .hero-right span { display: block; font-size: 9px; font-weight: 800; letter-spacing: 1px; color: var(--primary); }
        .hero-right b { font-size: 16px; letter-spacing: 1px; }

        /* 搜索框毛玻璃 */
        .search-area { margin: -40px 20px 20px; position: relative; z-index: 10; }
        #searchBox { 
            width: 100%; padding: 18px 25px 18px 60px; border-radius: 22px; 
            background: rgba(255,255,255,0.15); backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border); color: white; outline: none; box-sizing: border-box; 
        }

        /* 内容卡片 */
        .card { 
            background: var(--glass-surface); backdrop-filter: blur(30px);
            margin: 0 16px 15px; padding: 22px; border-radius: 32px; border: 1px solid var(--glass-border);
        }
        .name { font-size: 24px; font-weight: 900; }
        .memo-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 20px; font-size: 13px; border-left: 4px solid var(--primary); margin-top: 10px; }

        /* 详情页 & 弹窗 */
        .page-view { display: none; }
        .page-view.active { display: block; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); display: none; z-index: 2000; align-items: flex-end; }
        .modal-content { 
            background: rgba(30, 30, 50, 0.95); width: 100%; border-radius: 40px 40px 0 0; padding: 30px; box-sizing: border-box; color: white;
        }
        .input { width: 100%; padding: 14px; border: 1px solid var(--glass-border); border-radius: 15px; background: rgba(255,255,255,0.05); color: white; margin-top: 5px; box-sizing: border-box; }
        
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 90px; background: rgba(15, 12, 41, 0.8); backdrop-filter: blur(30px); display: flex; align-items: center; z-index: 1000; border-top: 1px solid var(--glass-border); }
        .tab-item { flex: 1; text-align: center; color: rgba(255,255,255,0.4); font-size: 11px; }
        .tab-item.active { color: var(--primary); }
        .add-btn { width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -40px; box-shadow: 0 10px 20px rgba(0, 210, 255, 0.4); }
    </style>
</head>
<body>

<div class="glow-sphere"></div>

<div id="view-list" class="page-view active">
    <div class="hero">
        <div class="hero-left">
            <div style="opacity:0.6; font-size:10px; letter-spacing:3px; font-weight:800;">SYSTEM ONLINE</div>
            <div class="hero-num" id="totalCount">0</div>
            <div style="font-weight:700; opacity:0.9;">核心决策资产已入库</div>
        </div>
        <div class="hero-right">
            <span>CORE STATUS</span>
            <b>RUNNING</b>
        </div>
    </div>
    <div class="search-area">
        <i class="fa-solid fa-search" style="position:absolute; left:25px; top:50%; transform:translateY(-50%); color:var(--primary);"></i>
        <input type="text" id="searchBox" placeholder="搜寻姓名、ID、备注..." oninput="renderList()">
    </div>
    <div id="listContainer"></div>
</div>

<div id="view-detail" class="page-view" style="padding:20px;">
    <div onclick="switchTab('list')" style="font-weight:800; color:var(--text-sub); margin-bottom:20px;"><i class="fa-solid fa-arrow-left"></i> 返回档案库</div>
    <div id="detailContainer"></div>
</div>

<div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('list')"><i class="fa-solid fa-layer-group" style="display:block; font-size:22px;"></i>中枢</div>
    <div class="tab-item"><i class="fa-solid fa-brain" style="display:block; font-size:22px;"></i>军师</div>
    <div class="add-btn" onclick="openForm()"><i class="fa-solid fa-plus"></i></div>
    <div class="tab-item"><i class="fa-solid fa-chart-pie" style="display:block; font-size:22px;"></i>穿透</div>
    <div class="tab-item" onclick="syncData()"><i class="fa-solid fa-cloud-arrow-up" style="display:block; font-size:22px;"></i>同步</div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 style="margin:0 0 20px;">档案维护</h2>
        <input type="hidden" id="editId">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div><label style="font-size:10px; opacity:0.6;">姓名</label><input type="text" id="name" class="input"></div>
            <div><label style="font-size:10px; opacity:0.6;">职务</label><input type="text" id="job" class="input"></div>
        </div>
        <div style="margin-top:10px;"><label style="font-size:10px; opacity:0.6;">公司</label><input type="text" id="company" class="input"></div>
        <div style="margin-top:10px;"><label style="font-size:10px; opacity:0.6;">电话</label><input type="text" id="phone" class="input"></div>
        <div style="margin-top:10px;"><label style="font-size:10px; opacity:0.6;">核心决策备忘</label><textarea id="demands" rows="3" class="input"></textarea></div>
        <button onclick="saveData()" style="width:100%; padding:18px; background:var(--primary); color:white; border:none; border-radius:18px; font-weight:900; margin-top:20px;">确认同步</button>
        <button onclick="closeForm()" style="width:100%; padding:10px; background:none; border:none; color:var(--text-sub);">取消</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];

    async function init() {
        const { data } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
        customers = data || [];
        renderList();
    }

    function switchTab(view) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
        window.scrollTo(0,0);
    }

    function renderList() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        const list = customers.filter(c => String(c.name).toLowerCase().includes(kw) || String(c.company).toLowerCase().includes(kw));
        document.getElementById('totalCount').innerText = list.length;
        list.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => showDetail(c.id);
            div.innerHTML = `
                <div class="card-header"><span class="name">${c.name}</span><span style="font-size:10px; opacity:0.5;">${c.cust_id || 'a1'}</span></div>
                <div style="font-size:13px; color:var(--text-sub);">${c.company || ''} · ${c.job || ''}</div>
                <div class="memo-box">${c.demands || '点击完善...'}</div>
            `;
            container.appendChild(div);
        });
    }

    function showDetail(id) {
        const c = customers.find(x => x.id == id);
        switchTab('detail');
        document.getElementById('detailContainer').innerHTML = `
            <div class="card" style="margin:0; padding:30px; text-align:center;">
                <h2 style="font-size:35px; margin:0;">${c.name}</h2>
                <p style="color:var(--primary); font-weight:800;">${c.company} · ${c.job}</p>
                <div class="memo-box" style="text-align:left; background:rgba(255,255,255,0.05);">${c.demands || '无内容'}</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px;">
                    <a href="tel:${c.phone}" style="padding:15px; background:var(--primary); color:white; border-radius:15px; text-decoration:none; font-weight:800;">拨号</a>
                    <button onclick="openForm(${c.id})" style="padding:15px; background:rgba(255,255,255,0.1); color:white; border:none; border-radius:15px;">编辑</button>
                </div>
            </div>
        `;
    }

    function openForm(id = null) {
        document.getElementById('editId').value = id || '';
        if(id) {
            const c = customers.find(x => x.id == id);
            ['name','job','company','phone','demands'].forEach(f => document.getElementById(f).value = c[f] || '');
        } else {
            ['name','job','company','phone','demands'].forEach(f => document.getElementById(f).value = '');
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function closeForm() { document.getElementById('modal').style.display = 'none'; }

    async function saveData() {
        const id = document.getElementById('editId').value;
        const row = { name: document.getElementById('name').value, job: document.getElementById('job').value, company: document.getElementById('company').value, phone: document.getElementById('phone').value, demands: document.getElementById('demands').value };
        const { error } = id ? await supabaseClient.from('customers').update(row).eq('id', id) : await supabaseClient.from('customers').insert([row]);
        if(!error) { init(); closeForm(); switchTab('list'); }
    }

    function syncData() { init(); alert("同步成功"); }
    init();
</script>
</body>
</html>
