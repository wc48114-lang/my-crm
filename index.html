<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>纵横 · 决策全能终端</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --primary:#00d2ff;
    --glass-surface:rgba(255,255,255,.12);
    --glass-border:rgba(255,255,255,.2);
    --text-main:#fff;
    --text-sub:rgba(255,255,255,.7);
}

/* ===== 全局背景 ===== */
body{
    margin:0;
    font-family:'PingFang SC',sans-serif;
    color:var(--text-main);
    padding-bottom:110px;
    min-height:100vh;
    background:linear-gradient(125deg,#0f0c29,#302b63,#24243e,#004e92,#00c6ff);
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
}
@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* ===== Hero ===== */
.hero{
    position:relative;
    padding:50px 25px 80px;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-bottom:1px solid var(--glass-border);
    border-bottom-left-radius:50px;
    border-bottom-right-radius:50px;
}

.hero-num{
    font-size:65px;
    font-weight:900;
    letter-spacing:-2px;
}

/* ===== 炫光小球（正确版本：挂在 Hero 内） ===== */
.glow-orb{
    position:absolute;
    top:22px;
    right:22px;
    width:42px;
    height:42px;
    border-radius:50%;
    pointer-events:none;
    z-index:2;
    background:radial-gradient(
        circle at 30% 30%,
        #fff,
        #7ee8ff 30%,
        #00d2ff 55%,
        rgba(0,210,255,.2) 70%,
        rgba(0,210,255,0) 75%
    );
    box-shadow:
        0 0 14px rgba(0,210,255,.9),
        0 0 36px rgba(0,210,255,.6),
        0 0 80px rgba(0,210,255,.4);
    animation:orbFloat 6s ease-in-out infinite,
              orbGlow 3s ease-in-out infinite;
}
@keyframes orbFloat{
    0%{transform:translate(0,0)}
    50%{transform:translate(-6px,8px)}
    100%{transform:translate(0,0)}
}
@keyframes orbGlow{
    0%{opacity:.7}
    50%{opacity:1}
    100%{opacity:.7}
}

/* ===== 搜索 ===== */
.search-area{
    margin:-40px 20px 20px;
    position:relative;
    z-index:5;
}
#searchBox{
    width:100%;
    padding:20px 25px 20px 60px;
    border:none;
    border-radius:25px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    border:1px solid var(--glass-border);
    color:#fff;
    font-size:16px;
}
#searchBox::placeholder{color:rgba(255,255,255,.5)}
.search-icon{
    position:absolute;
    left:25px;
    top:50%;
    transform:translateY(-50%);
    color:var(--primary);
}

/* ===== 卡片 ===== */
.card{
    background:var(--glass-surface);
    backdrop-filter:blur(30px);
    margin:0 16px 18px;
    padding:22px;
    border-radius:35px;
    border:1px solid var(--glass-border);
}
.card-header{
    display:flex;
    justify-content:space-between;
}
.name{font-size:24px;font-weight:900}
.cust-id-tag{
    font-size:10px;
    padding:2px 8px;
    border-radius:6px;
    background:rgba(255,255,255,.15);
}

/* ===== Tab ===== */
.tab-bar{
    position:fixed;
    bottom:0;
    width:100%;
    height:95px;
    background:rgba(20,20,40,.4);
    backdrop-filter:blur(40px);
    display:flex;
    align-items:center;
    z-index:1000;
}
.tab-item{
    flex:1;
    text-align:center;
    color:rgba(255,255,255,.5);
    font-size:11px;
}
.tab-item.active{color:var(--primary)}
.add-btn{
    width:65px;
    height:65px;
    background:var(--primary);
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin-top:-45px;
}
</style>
</head>

<body>

<div id="view-list" class="page-view active" style="padding:0;">
    <div class="hero">
        <div class="glow-orb"></div>

        <div style="opacity:.6;font-size:10px;letter-spacing:3px;font-weight:800;">
            SYSTEM ONLINE
        </div>
        <div class="hero-num" id="totalCount">0</div>
        <div style="font-weight:700;opacity:.9;">核心决策资产已入库</div>
    </div>

    <div class="search-area">
        <i class="fa-solid fa-search search-icon"></i>
        <input id="searchBox" placeholder="搜寻姓名、ID、备忘、职务..." oninput="renderList()">
    </div>

    <div id="listContainer"></div>
</div>

<!-- 底部 Tab -->
<div class="tab-bar">
    <div class="tab-item active"><i class="fa-solid fa-layer-group"></i><span>中枢</span></div>
    <div class="tab-item"><i class="fa-solid fa-brain"></i><span>军师</span></div>
    <div class="add-btn"><i class="fa-solid fa-plus"></i></div>
    <div class="tab-item"><i class="fa-solid fa-chart-pie"></i><span>穿透</span></div>
    <div class="tab-item"><i class="fa-solid fa-cloud-arrow-up"></i><span>同步</span></div>
</div>

<script>
const SB_URL='https://vnyjfikjvttwmyzirhzn.supabase.co';
const SB_KEY='你的key';
const supabaseClient=supabase.createClient(SB_URL,SB_KEY);
let customers=[];

async function init(){
    const {data}=await supabaseClient.from('customers').select('*');
    customers=data||[];
    renderList();
}

function renderList(){
    const kw=document.getElementById('searchBox').value.toLowerCase();
    const box=document.getElementById('listContainer');
    box.innerHTML='';
    const list=customers.filter(c=>Object.values(c).some(v=>String(v).toLowerCase().includes(kw)));
    document.getElementById('totalCount').innerText=list.length;
    list.forEach(c=>{
        const d=document.createElement('div');
        d.className='card';
        d.innerHTML=`
            <div class="card-header">
                <span class="name">${c.name}</span>
                <span class="cust-id-tag">${c.cust_id||'a1'}</span>
            </div>
            <div style="opacity:.7;font-size:13px;">${c.company||''} · ${c.job||''}</div>
        `;
        box.appendChild(d);
    });
}
init();
</script>

</body>
</html>
