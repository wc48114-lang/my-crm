<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 顶级决策系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0f172a; --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'PingFang SC', sans-serif; background: var(--bg); margin: 0; padding-bottom: 110px; color: #1e293b; }
        
        /* 恢复原版黑金头部 */
        .hero { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            padding: 60px 25px 80px; color: white; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; 
        }
        .hero-num { font-size: 70px; font-weight: 900; line-height: 1; }

        /* 恢复原版卡片风格 */
        .card { 
            background: white; margin: 0 16px 18px; padding: 25px; border-radius: 35px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.03); position: relative;
        }
        
        /* 底部导航栏（五个键全部回归） */
        .tab-bar { 
            position: fixed; bottom: 0; width: 100%; height: 95px; background: rgba(255,255,255,0.95); 
            backdrop-filter: blur(15px); display: flex; align-items: center; z-index: 1000; border-top: 1px solid #eee;
        }
        .tab-item { flex: 1; text-align: center; color: #94a3b8; font-size: 11px; font-weight: 800; }
        .tab-item.active { color: var(--primary); }
        .tab-item i { font-size: 24px; margin-bottom: 4px; display: block; }
        .add-btn { 
            width: 65px; height: 65px; background: var(--primary); color: white; border-radius: 22px; 
            display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -45px; 
            border: 6px solid var(--bg); box-shadow: 0 10px 20px rgba(37,99,235,0.3);
        }

        /* 弹窗风格 */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 2000; align-items: flex-end; }
        .modal-content { background: white; width: 100%; border-radius: 45px 45px 0 0; padding: 30px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        .input { width: 100%; padding: 16px; border: 2px solid #f1f5f9; border-radius: 18px; background: #f8fafc; margin-bottom: 12px; font-size: 15px; outline: none; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 22px; background: var(--dark); color: white; border: none; border-radius: 25px; font-weight: 900; font-size: 17px; }
        
        .page-view { display: none; }
        .page-view.active { display: block; }
    </style>
</head>
<body>

<div id="view-list" class="page-view active">
    <div class="hero">
        <div style="opacity:0.6; font-size:11px; letter-spacing:2px;">STRATEGIC ASSETS</div>
        <div class="hero-num" id="totalCount">0</div>
        <div style="font-weight:700;">位核心资源已就绪</div>
    </div>
    <div id="listContainer" style="margin-top:-35px;"></div>
</div>

<div id="view-detail" class="page-view" style="padding:20px;">
    <div onclick="switchTab('list')" style="margin-bottom:20px; color:#64748b; font-weight:800;"><i class="fa-solid fa-arrow-left"></i> 返回档案</div>
    <div id="detailContainer"></div>
</div>

<div id="view-ai" class="page-view" style="padding:30px;">
    <h2 style="font-weight:900; font-size:32px;">AI 决策攻坚</h2>
    <div id="aiContent" style="background:white; padding:25px; border-radius:30px; line-height:1.8;">正在分析全盘资源...</div>
</div>

<div id="view-stats" class="page-view" style="padding:30px;">
    <h2 style="font-weight:900; font-size:32px;">资源分布穿透</h2>
    <canvas id="statChart"></canvas>
</div>

<div class="tab-bar">
    <div class="tab-item active" id="tab-list" onclick="switchTab('list')"><i class="fa-solid fa-layer-group"></i><span>中枢</span></div>
    <div class="tab-item" id="tab-ai" onclick="switchTab('ai')"><i class="fa-solid fa-brain"></i><span>军师</span></div>
    <div class="add-btn" onclick="openForm()"><i class="fa-solid fa-plus"></i></div>
    <div class="tab-item" id="tab-stats" onclick="switchTab('stats')"><i class="fa-solid fa-chart-pie"></i><span>穿透</span></div>
    <div class="tab-item" onclick="init()"><i class="fa-solid fa-sync"></i><span>同步</span></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 style="margin:0 0 20px; font-weight:900;">档案维护</h2>
        <input type="hidden" id="editId">
        <input type="text" id="cust_id" class="input" placeholder="用户编号 (系统自动分配)" readonly style="background:#eee;">
        <input type="text" id="name" class="input" placeholder="姓名 (必填)">
        <input type="text" id="company" class="input" placeholder="公司 / 机构">
        <input type="text" id="job" class="input" placeholder="职务">
        <input type="text" id="phone" class="input" placeholder="联系电话">
        <input type="text" id="wechat" class="input" placeholder="微信号">
        <input type="email" id="email" class="input" placeholder="电子邮箱">
        <input type="text" id="address" class="input" placeholder="办公地址 / 地区">
        <textarea id="demands" rows="3" class="input" placeholder="核心备忘录..."></textarea>
        <button class="save-btn" onclick="saveData()">同步至决策云端</button>
        <button onclick="closeForm()" style="width:100%; border:none; background:none; color:#94a3b8; margin-top:15px;">取消返回</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];
    let myChart = null;

    async function init() {
        const { data } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
        customers = data || [];
        renderList();
    }

    function switchTab(view) {
        document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
        if(document.getElementById('tab-' + view)) document.getElementById('tab-' + view).classList.add('active');
        if(view === 'stats') renderChart();
        if(view === 'ai') document.getElementById('aiContent').innerText = "针对当前 " + customers.length + " 位核心资源的分析：建议加强对高价值客户的线下面谈。";
    }

    function renderList() {
        document.getElementById('totalCount').innerText = customers.length;
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        customers.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => showDetail(c.id);
            div.innerHTML = `
                <div style="font-size:10px; color:#94a3b8; margin-bottom:5px;">${c.cust_id || 'ID-NEW'}</div>
                <div style="font-size:22px; font-weight:900;">${c.name}</div>
                <div style="color:var(--primary); font-size:13px; font-weight:700;">${c.company || '个人'} · ${c.job || '-'}</div>
            `;
            container.appendChild(div);
        });
    }

    function showDetail(id) {
        const c = customers.find(x => x.id == id);
        switchTab('detail');
        document.getElementById('detailContainer').innerHTML = `
            <div style="background:white; border-radius:40px; padding:30px; text-align:center;">
                <div style="font-size:12px; color:#94a3b8;">${c.cust_id || '编号待定'}</div>
                <h2 style="font-size:35px; margin:10px 0;">${c.name}</h2>
                <div style="color:var(--primary); font-weight:800; margin-bottom:25px;">${c.company} · ${c.job}</div>
                
                <div style="display:flex; gap:12px; margin-bottom:25px;">
                    <a href="tel:${c.phone}" style="flex:1; background:var(--primary); color:white; padding:18px; border-radius:20px; text-decoration:none; font-weight:900;">拨号盘</a>
                    <div onclick="openForm(${c.id})" style="flex:1; background:#f1f5f9; padding:18px; border-radius:20px; font-weight:900;">编辑</div>
                </div>

                <div style="background:#f8fafc; padding:20px; border-radius:25px; text-align:left; margin-bottom:20px;">
                    <div style="font-size:11px; color:#94a3b8; font-weight:900; margin-bottom:8px;">决策备忘录</div>
                    <div style="font-size:15px; line-height:1.7;">${c.demands || '无内容'}</div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; text-align:left; font-size:13px;">
                    <div><span style="color:#94a3b8;">微信</span><br><b>${c.wechat || '-'}</b></div>
                    <div><span style="color:#94a3b8;">邮箱</span><br><b>${c.email || '-'}</b></div>
                    <div style="grid-column: span 2;"><span style="color:#94a3b8;">办公地址</span><br><b>${c.address || '-'}</b></div>
                </div>
            </div>
        `;
    }

    function openForm(id = null) {
        document.querySelectorAll('.input').forEach(i => i.value = '');
        if(id) {
            const c = customers.find(x => x.id == id);
            document.getElementById('editId').value = c.id;
            document.getElementById('cust_id').value = c.cust_id || '';
            document.getElementById('name').value = c.name;
            document.getElementById('company').value = c.company;
            document.getElementById('job').value = c.job;
            document.getElementById('phone').value = c.phone;
            document.getElementById('wechat').value = c.wechat;
            document.getElementById('email').value = c.email;
            document.getElementById('address').value = c.address;
            document.getElementById('demands').value = c.demands;
        } else {
            document.getElementById('editId').value = '';
            document.getElementById('cust_id').value = 'SN-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function closeForm() { document.getElementById('modal').style.display = 'none'; }

    async function saveData() {
        const id = document.getElementById('editId').value;
        const row = {
            cust_id: document.getElementById('cust_id').value || ('SN-' + Math.random().toString(36).substr(2, 6).toUpperCase()),
            name: document.getElementById('name').value,
            company: document.getElementById('company').value,
            job: document.getElementById('job').value,
            phone: document.getElementById('phone').value,
            wechat: document.getElementById('wechat').value,
            email: document.getElementById('email').value,
            address: document.getElementById('address').value,
            demands: document.getElementById('demands').value
        };
        const { error } = id ? await supabaseClient.from('customers').update(row).eq('id', id) : await supabaseClient.from('customers').insert([row]);
        if(!error) { alert("同步成功！"); closeForm(); init(); switchTab('list'); }
        else alert("同步失败");
    }

    function renderChart() {
        const ctx = document.getElementById('statChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['核心资产', '潜在资源'], datasets: [{ data: [customers.length, 5], backgroundColor: ['#2563eb', '#e2e8f0'] }] }
        });
    }

    init();
</script>
</body>
</html>
