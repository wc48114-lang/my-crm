<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>私享客 CRM V6.8 - 丝滑重连版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --card: #ffffff; }
        
        /* 彻底干掉黑夜模式带来的僵硬感 */
        html, body { 
            background-color: var(--bg) !important; 
            color: #1e293b !important;
            margin: 0; padding-bottom: 120px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .header-sky { 
            background: linear-gradient(135deg, #4f46e5, #7c3aed); 
            padding: 50px 25px 70px; border-radius: 0 0 50px 50px; 
            color: white; box-shadow: 0 15px 30px rgba(79, 70, 229, 0.15);
            text-align: center;
        }

        #searchBox { 
            width: calc(100% - 40px); margin: -35px 20px 25px; 
            padding: 20px 28px; border: none; border-radius: 25px; 
            background: white !important; color: #1e293b !important;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08); font-size: 16px; outline: none; box-sizing: border-box;
        }

        .customer-card { 
            background: var(--card) !important; border-radius: 30px; padding: 25px; 
            margin: 0 18px 20px; position: relative; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            transition: transform 0.2s; border: 1px solid rgba(255,255,255,1);
        }
        .customer-card:active { transform: scale(0.98); }

        .name-tag { font-size: 22px; font-weight: 800; color: #0f172a; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .info-pill { font-size: 12px; padding: 6px 14px; border-radius: 12px; background: #f1f5f9; color: #64748b; font-weight: 600; }
        
        .demand-box { 
            background: #fffbeb !important; padding: 18px; border-radius: 20px; 
            font-size: 15px; color: #92400e !important; line-height: 1.6;
            margin-top: 15px; border-left: 6px solid #fbbf24;
        }

        /* 底部导航栏：灵动悬浮 */
        .bottom-nav { 
            position: fixed; bottom: 30px; left: 25px; right: 25px; 
            height: 75px; background: #1e293b; border-radius: 35px; 
            display: flex; justify-content: space-around; align-items: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.3); z-index: 999;
        }
        .main-add-btn { 
            width: 70px; height: 70px; background: var(--primary); color: white; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            font-size: 40px; margin-top: -55px; border: 6px solid var(--bg);
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        /* 弹窗：苹果风半透明 */
        .glass-modal { 
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.4); z-index: 1000; 
            align-items: flex-end; backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
        }
        .modal-sheet { 
            background: white !important; width: 100%; border-radius: 40px 40px 0 0; 
            padding: 35px 30px; box-sizing: border-box; max-height: 90vh; overflow-y: auto;
        }
        
        input, textarea { 
            width: 100%; padding: 18px; margin: 10px 0 20px; 
            border-radius: 18px; border: 1px solid #e2e8f0; 
            background: #f8fafc !important; font-size: 16px; box-sizing: border-box;
        }
        .save-btn { 
            width: 100%; padding: 20px; background: var(--primary); 
            color: white; border: none; border-radius: 22px; 
            font-weight: 800; font-size: 18px; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body>

<div class="header-sky">
    <div style="font-size: 14px; font-weight: 600; opacity: 0.9;" id="connStatus">🔗 正在读取云端档案...</div>
    <div style="font-size: 42px; font-weight: 900; margin-top: 12px;" id="totalCount">...</div>
</div>

<input type="text" id="searchBox" placeholder="搜索伙伴姓名、诉求或手机号...">
<div id="cardList"></div>

<div class="bottom-nav">
    <div onclick="location.reload()" style="font-size: 26px;">🏠</div>
    <div class="main-add-btn" onclick="openAdd()">+</div>
    <div onclick="alert('即将上线')" style="font-size: 26px;">📦</div>
</div>

<div class="glass-modal" id="formModal">
    <div class="modal-sheet">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="margin:0; font-size:24px;">录入客户信息</h2>
            <div onclick="closeAdd()" style="color:#cbd5e1; font-size:28px;">✕</div>
        </div>
        <input type="hidden" id="editId">
        <label style="font-weight:bold; color:#64748b; font-size:13px;">姓名</label>
        <input type="text" id="name" placeholder="请输入姓名">
        <label style="font-weight:bold; color:#64748b; font-size:13px;">核心诉求</label>
        <textarea id="demands" rows="4" placeholder="他最看重什么？"></textarea>
        <button onclick="saveData()" id="saveBtn" class="save-btn">保存并同步云端</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR3bXl6aXJoem4iLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc2OTA3MTQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const client = supabase.createClient(SB_URL, SB_KEY);

    let allCustomers = [];

    async function load() {
        try {
            const { data, error } = await client.from('customers').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            allCustomers = data || [];
            document.getElementById('connStatus').innerText = "✅ 数据同步已就绪";
            renderCards();
        } catch (e) {
            document.getElementById('connStatus').innerText = "⚠️ 连接不稳定，重连中...";
            setTimeout(load, 3000);
        }
    }

    function renderCards() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('cardList');
        const filtered = allCustomers.filter(c => JSON.stringify(c).toLowerCase().includes(kw));
        document.getElementById('totalCount').innerText = `${filtered.length} 位伙伴`;
        
        container.innerHTML = filtered.map(c => `
            <div class="customer-card">
                <div class="name-tag">
                    ${c.name} 
                    <span class="info-pill">📱 ${c.phone || '未记录'}</span>
                </div>
                <div class="demand-box" onclick="editNow(${c.id})">
                    ${c.demands || '点击录入核心诉求...'}
                </div>
            </div>
        `).join('');
    }

    // 🏆 拦截返回键逻辑
    function openAdd() {
        document.getElementById('formModal').style.display = 'flex';
        history.pushState({modalOpen: true}, "");
    }
    function closeAdd() {
        document.getElementById('formModal').style.display = 'none';
        if(history.state && history.state.modalOpen) history.back();
    }
    window.onpopstate = () => document.getElementById('formModal').style.display = 'none';

    async function saveData() {
        const n = document.getElementById('name').value;
        if(!n) return alert("姓名是必须的哦");
        const btn = document.getElementById('saveBtn');
        btn.innerText = "正在同步..."; btn.disabled = true;
        
        const payload = { name: n, demands: document.getElementById('demands').value };
        const eid = document.getElementById('editId').value;

        try {
            if(eid) await client.from('customers').update(payload).eq('id', eid);
            else await client.from('customers').insert([payload]);
            await load();
            closeAdd();
        } catch(e) { alert("同步失败"); }
        finally { btn.innerText = "保存并同步云端"; btn.disabled = false; }
    }

    function editNow(id) {
        const c = allCustomers.find(x => x.id == id);
        document.getElementById('editId').value = c.id;
        document.getElementById('name').value = c.name;
        document.getElementById('demands').value = c.demands || '';
        openAdd();
    }

    load();
    document.getElementById('searchBox').oninput = renderCards;
</script>
</body>
</html>
