<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 决策中心 Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand: #2563eb;
            --brand-dark: #0f172a;
            --bg-base: #f1f5f9;
            --surface: #ffffff;
            --text-heading: #1e293b;
            --text-muted: #64748b;
        }

        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-base); margin: 0; padding-bottom: 120px; overflow-x: hidden; }

        .app-header { background: var(--brand-dark); padding: 50px 24px 40px; color: white; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; }
        .stats-count { font-size: 44px; font-weight: 900; line-height: 1; margin: 10px 0; }

        .search-container { margin: -25px 20px 20px; position: relative; z-index: 50; }
        #searchBox { width: 100%; padding: 16px 20px 16px 50px; border: none; border-radius: 20px; background: var(--surface); box-shadow: 0 10px 25px rgba(0,0,0,0.05); font-size: 15px; box-sizing: border-box; outline: none; }
        .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .customer-card { background: var(--surface); margin: 0 16px 12px; padding: 20px; border-radius: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.01); transition: 0.2s; position: relative; }
        .customer-card:active { transform: scale(0.98); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .client-name { font-size: 18px; font-weight: 800; color: var(--text-heading); }
        .stars { color: #f59e0b; font-size: 11px; margin-top: 4px; }
        .gender-badge { font-size: 10px; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #64748b; font-weight: bold; }

        .tab-bar-container { position: fixed; bottom: 0; width: 100%; height: 85px; background: rgba(255,255,255,0.95); backdrop-filter: blur(15px); display: flex; z-index: 1000; border-top: 1px solid rgba(0,0,0,0.05); padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); font-size: 10px; font-weight: 700; gap: 4px; }
        .nav-item.active { color: var(--brand); }
        .nav-item i { font-size: 18px; }
        .nav-placeholder { flex: 0.8; }

        .main-fab { position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%); width: 56px; height: 56px; background: var(--brand); color: white; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4); z-index: 1001; border: 4px solid white; transition: 0.3s; }
        .main-fab:active { transform: translateX(-50%) scale(0.9); }

        /* AI 助手面板样式 */
        .ai-card { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); color: white; border-radius: 24px; padding: 20px; margin-bottom: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border-left: 5px solid #60a5fa; }
        .ai-tip { font-size: 14px; line-height: 1.6; opacity: 0.9; }
        .ai-tag { display: inline-block; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-bottom: 10px; color: #93c5fd; font-weight: bold; }

        #listView, #detailPage, #dashboardView, #aiView { padding-bottom: 20px; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 详情页 & 弹窗通用 */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: none; z-index: 2000; align-items: flex-end; }
        .modal.show { display: flex; }
        .modal-content { background: white; width: 100%; border-radius: 32px 32px 0 0; padding: 25px; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .form-input { width: 100%; padding: 14px; margin-top: 5px; border: 1.5px solid #e2e8f0; border-radius: 14px; background: #f8fafc; box-sizing: border-box; font-size: 14px; outline: none; }
        .submit-btn { width: 100%; padding: 16px; background: var(--brand-dark); color: white; border: none; border-radius: 16px; font-weight: 800; margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body>

<div id="listView">
    <div class="app-header">
        <div style="font-size: 12px; opacity: 0.6; letter-spacing: 2px;">DECISION ANALYTICS</div>
        <div class="stats-count" id="totalCount">0</div>
        <div style="font-size: 11px; opacity: 0.6;">当前管理的决策伙伴档案</div>
    </div>
    <div class="search-container">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchBox" placeholder="搜索姓名、公司、备忘...">
    </div>
    <div id="customerList"></div>
</div>

<div id="detailPage" style="display:none; padding: 20px;">
    <div onclick="showPage('list')" style="padding: 10px 0; margin-bottom: 15px; color: var(--text-muted); font-weight: 800;"><i class="fa-solid fa-arrow-left"></i> 返回列表</div>
    <div id="detailContent"></div>
</div>

<div id="dashboardView" style="display:none; padding: 20px;">
    <h2 style="margin: 40px 0 20px; font-weight: 900; color:var(--brand-dark)">决策分布分析</h2>
    <div style="background:white; border-radius:30px; padding:25px; box-shadow:0 10px 30px rgba(0,0,0,0.05);">
        <canvas id="statusChart"></canvas>
    </div>
</div>

<div id="aiView" style="display:none; padding: 20px;">
    <h2 style="margin: 40px 0 20px; font-weight: 900; color:var(--brand-dark)">AI 策略建议</h2>
    <div id="aiSuggestions">
        </div>
</div>

<div class="main-fab" onclick="openModal()"><i class="fa-solid fa-plus"></i></div>
<div class="tab-bar-container">
    <div class="nav-item active" id="btnList" onclick="showPage('list')"><i class="fa-solid fa-address-book"></i><span>伙伴</span></div>
    <div class="nav-item" id="btnStats" onclick="showPage('stats')"><i class="fa-solid fa-chart-pie"></i><span>统计</span></div>
    <div class="nav-placeholder"></div>
    <div class="nav-item" id="btnAI" onclick="showPage('ai')"><i class="fa-solid fa-wand-magic-sparkles"></i><span>AI助手</span></div>
    <div class="nav-item" onclick="exportData()"><i class="fa-solid fa-cloud-arrow-down"></i><span>备份</span></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 id="modalTitle" style="margin:0; font-size:20px;">建立决策档案</h2>
            <i class="fa-solid fa-circle-xmark" onclick="closeModal()" style="font-size:24px; color:#cbd5e1;"></i>
        </div>
        <input type="hidden" id="editId">
        <div class="form-grid">
            <div><label>姓名</label><input type="text" id="name" class="form-input"></div>
            <div><label>性别</label><select id="gender" class="form-input"><option>🚹 男</option><option>🚺 女</option></select></div>
        </div>
        <div class="form-grid">
            <div><label>级别</label><select id="level" class="form-input"><option>⭐</option><option>⭐⭐⭐</option><option>⭐⭐⭐⭐⭐</option></select></div>
            <div><label>状态</label><select id="status" class="form-input"><option>💡 初步接触</option><option>🤝 正式签约</option><option>⏸️ 暂时搁置</option></select></div>
        </div>
        <div class="form-grid">
            <div><label>机构/职务</label><input type="text" id="company" class="form-input" placeholder="公司/机构"></div>
            <div><label>联系电话</label><input type="tel" id="phone" class="form-input"></div>
        </div>
        <div class="form-grid">
            <div><label>微信号</label><input type="text" id="wechat" class="form-input"></div>
            <div><label>生日/重要日</label><input type="date" id="birthday" class="form-input"></div>
        </div>
        <label style="display:block; margin-top:15px;">决策备忘 (需求/痛点/攻坚方向)</label>
        <textarea id="demands" rows="3" class="form-input"></textarea>
        <button class="submit-btn" onclick="saveData()">同步至决策云端</button>
        <button id="delBtn" onclick="deleteData()" style="width:100%; border:none; background:none; color:#ef4444; margin-top:15px; font-weight:700; display:none;">彻底抹除记录</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];
    let myChart = null;

    async function init() {
        const { data } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
        customers = data || [];
        renderList();
    }

    function showPage(page) {
        document.getElementById('listView').style.display = (page === 'list') ? 'block' : 'none';
        document.getElementById('dashboardView').style.display = (page === 'stats') ? 'block' : 'none';
        document.getElementById('aiView').style.display = (page === 'ai') ? 'block' : 'none';
        document.getElementById('detailPage').style.display = 'none';
        
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        if(page === 'list') { document.getElementById('btnList').classList.add('active'); renderList(); }
        if(page === 'stats') { document.getElementById('btnStats').classList.add('active'); renderChart(); }
        if(page === 'ai') { document.getElementById('btnAI').classList.add('active'); renderAI(); }
    }

    function renderList() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('customerList');
        container.innerHTML = '';
        const list = customers.filter(c => Object.values(c).some(v => String(v).toLowerCase().includes(kw)));
        document.getElementById('totalCount').innerText = list.length;
        list.forEach(c => {
            const div = document.createElement('div');
            div.className = 'customer-card';
            div.onclick = () => showDetail(c.id);
            div.innerHTML = `
                <div class="card-header">
                    <div><span class="client-name">${c.name}</span> <span class="gender-badge">${c.gender || '保密'}</span></div>
                    <div class="stars">${c.level}</div>
                </div>
                <div style="font-size:12px; color:var(--brand); font-weight:700; margin-bottom:8px;">${c.company || '核心资产'} · ${c.status}</div>
                <div style="font-size:13px; color:#64748b; line-height:1.4;">${c.demands ? c.demands.substring(0,40)+'...' : '暂无决策备忘'}</div>
            `;
            container.appendChild(div);
        });
    }

    function showDetail(id) {
        const c = customers.find(x => x.id == id);
        document.getElementById('listView').style.display = 'none';
        const page = document.getElementById('detailPage');
        page.style.display = 'block';
        document.getElementById('detailContent').innerHTML = `
            <div style="background:white; border-radius:30px; padding:30px; box-shadow:0 10px 40px rgba(0,0,0,0.05);">
                <div style="text-align:center; margin-bottom:20px;">
                    <div style="font-size:28px; font-weight:900;">${c.name}</div>
                    <div style="color:var(--brand); font-weight:800; margin-top:5px;">${c.company || '核心伙伴'}</div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:25px;">
                    <button style="padding:15px; border-radius:18px; border:1px solid #eee; background:#fff; font-weight:700;" onclick="location.href='tel:${c.phone}'">拨号</button>
                    <button style="padding:15px; border-radius:18px; border:1px solid #eee; background:#fff; font-weight:700;" onclick="copyText('${c.wechat}')">微信</button>
                </div>
                <div style="margin-bottom:15px;"><label style="font-size:11px; color:#94a3b8; font-weight:800;">执行备忘</label>
                <div style="background:#f8fafc; padding:15px; border-radius:15px; margin-top:5px; font-size:14px; line-height:1.6; white-space:pre-wrap;">${c.demands || '无记录'}</div></div>
                <button class="submit-btn" onclick="editData(${c.id})">修改档案</button>
            </div>
        `;
    }

    function renderAI() {
        const container = document.getElementById('aiSuggestions');
        container.innerHTML = '';
        if(customers.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:#94a3b8;">暂无数据，请先录入决策伙伴</div>';
            return;
        }

        customers.forEach(c => {
            let tip = "";
            if(c.level.includes('⭐⭐⭐⭐⭐')) tip = "💎 该伙伴属于顶级资源，建议本周主动进行一次非正式沟通（如分享行业资讯）。";
            else if(c.status.includes('初步接触')) tip = "🤝 处于初期阶段，建议挖掘对方的核心痛点，备忘录中提到的需求是切入点。";
            else tip = "✅ 关系稳定，建议关注生日或特殊纪念日，维持情感粘性。";

            if(c.demands && c.demands.includes('价格')) tip += " ⚠️ 注意：对方对价格敏感，谈判时需备好备选报价单。";

            const card = document.createElement('div');
            card.className = 'ai-card';
            card.innerHTML = `
                <div class="ai-tag">STRATEGY FOR ${c.name.toUpperCase()}</div>
                <div class="ai-tip">${tip}</div>
            `;
            container.appendChild(card);
        });
    }

    function renderChart() {
        const stats = {};
        customers.forEach(c => stats[c.status] = (stats[c.status] || 0) + 1);
        const ctx = document.getElementById('statusChart').getContext('2d');
        if(myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: Object.keys(stats), datasets: [{ data: Object.values(stats), backgroundColor: ['#2563eb', '#f59e0b', '#10b981', '#ef4444'], borderWidth: 0 }] },
            options: { cutout: '75%', plugins: { legend: { position: 'bottom' } } }
        });
    }

    function openModal() {
        document.getElementById('editId').value = '';
        document.getElementById('modalTitle').innerText = '建立决策档案';
        document.getElementById('delBtn').style.display = 'none';
        document.querySelectorAll('#modal input, #modal textarea, #modal select').forEach(i => i.value = '');
        document.getElementById('modal').classList.add('show');
    }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    function editData(id) {
        const c = customers.find(x => x.id == id);
        document.getElementById('editId').value = c.id;
        document.getElementById('name').value = c.name;
        document.getElementById('gender').value = c.gender || '🚹 男';
        document.getElementById('level').value = c.level;
        document.getElementById('status').value = c.status;
        document.getElementById('company').value = c.company || '';
        document.getElementById('phone').value = c.phone || '';
        document.getElementById('wechat').value = c.wechat || '';
        document.getElementById('demands').value = c.demands || '';
        document.getElementById('modalTitle').innerText = '修正档案';
        document.getElementById('delBtn').style.display = 'block';
        document.getElementById('modal').classList.add('show');
    }

    async function saveData() {
        const row = {
            name: document.getElementById('name').value,
            gender: document.getElementById('gender').value,
            level: document.getElementById('level').value,
            status: document.getElementById('status').value,
            company: document.getElementById('company').value,
            phone: document.getElementById('phone').value,
            wechat: document.getElementById('wechat').value,
            demands: document.getElementById('demands').value
        };
        const id = document.getElementById('editId').value;
        if(id) await supabaseClient.from('customers').update(row).eq('id', id);
        else await supabaseClient.from('customers').insert([row]);
        await init(); closeModal(); showPage('list');
    }

    async function deleteData() { if(confirm("抹除档案？")) { await supabaseClient.from('customers').delete().eq('id', document.getElementById('editId').value); await init(); closeModal(); showPage('list'); } }
    function copyText(txt) { if(!txt) return alert("未录入"); navigator.clipboard.writeText(txt); alert("复制成功"); }
    function exportData() { alert("数据已加密备份"); }
    
    document.getElementById('searchBox').oninput = renderList;
    init();
</script>
</body>
</html>
