<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>纵横 · 决策中心 CRM</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #6366f1; 
            --accent: #f59e0b; 
            --text-main: #1e293b; 
            --text-sub: #64748b;
            --card-bg: rgba(255, 255, 255, 0.9);
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; padding-bottom: 120px; 
            background: #f1f5f9;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* 顶部统计区：流光动效 */
        .stats-header {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            margin: 0 0 20px 0; padding: 40px 20px 60px;
            border-radius: 0 0 40px 40px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            color: white;
        }

        /* 搜索框 */
        #searchBox { 
            width: calc(100% - 40px); margin: -35px 20px 20px; 
            padding: 18px 25px; border: none; border-radius: 24px; 
            background: white; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            font-size: 16px; outline: none; box-sizing: border-box;
            transition: 0.3s;
        }

        /* 核心卡片 */
        .card { 
            background: var(--card-bg); border-radius: 28px; padding: 22px; 
            margin: 0 18px 18px; position: relative; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.8);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }

        .name { font-size: 22px; font-weight: 800; color: #0f172a; }
        
        /* ⭐ 星级闪烁动画特效 ⭐ */
        .stars-container { display: flex; gap: 2px; }
        .star-unit { 
            color: var(--accent); 
            font-size: 14px; 
            opacity: 0; 
            transform: scale(0.5);
            animation: starPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes starPop {
            to { opacity: 1; transform: scale(1); }
        }

        /* 标签色彩 */
        .mini-tag { font-size: 11px; padding: 5px 12px; border-radius: 12px; background: #fff; color: #475569; border: 1px solid #e2e8f0; }
        .status-active { background: #dcfce7 !important; color: #166534 !important; border-color: #bbf7d0 !important; }

        .demand-box { 
            background: #fffbeb; padding: 15px; border-radius: 20px; 
            font-size: 14px; color: #92400e; line-height: 1.6;
            border-left: 5px solid #fbbf24; margin-top: 15px;
        }

        .action-bar { display: flex; gap: 12px; margin-top: 20px; }
        .action-btn { flex: 1; padding: 14px; border-radius: 18px; border: none; font-size: 14px; font-weight: 700; text-decoration: none; text-align: center; }
        .btn-call { background: #6366f1; color: white; box-shadow: 0 8px 15px rgba(99, 102, 241, 0.25); }
        .btn-copy { background: #f1f5f9; color: #475569; }

        /* 底部导航 */
        .nav { position: fixed; bottom: 35px; left: 10%; right: 10%; background: rgba(30, 41, 59, 0.95); height: 70px; border-radius: 35px; display: flex; justify-content: space-around; align-items: center; z-index: 100; backdrop-filter: blur(15px); }
        .add-btn { width: 65px; height: 65px; background: #6366f1; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; margin-top: -50px; border: 6px solid #f1f5f9; }

        /* 弹窗优化 */
        .modal-content { background: white; width: 100%; border-radius: 35px 35px 0 0; padding: 30px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        .form-item label { display: block; font-size: 12px; color: var(--text-sub); margin: 0 0 8px 5px; }
        input, select, textarea { width: 100%; padding: 15px; border: 1px solid #e2e8f0; border-radius: 16px; background: #f8fafc; margin-bottom: 15px; box-sizing: border-box; font-size: 15px; }
    </style>
</head>
<body>

<div class="stats-header">
    <div id="syncStatus" style="font-size:12px; opacity:0.8">📡 正在接入决策终端...</div>
    <div style="font-size: 14px; opacity: 0.7; margin-top: 5px;">纵横 · 决策中心</div>
    <div style="font-size: 36px; font-weight: 900; margin-top: 5px;" id="totalCount">0 位伙伴</div>
</div>

<input type="text" id="searchBox" placeholder="快速搜寻目标...">

<div id="customerList"></div>

<div class="nav">
    <div style="font-size:24px; color:white" onclick="location.reload()">🏠</div>
    <div class="add-btn" onclick="openModal()">+</div>
    <div style="font-size:24px; color:white" onclick="exportData()">📦</div>
</div>

<div class="modal" id="modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1000; align-items:flex-end; backdrop-filter:blur(8px);">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;">
            <h2 style="margin:0; font-size:20px;">档案整备</h2>
            <span onclick="closeModal()" style="color:var(--text-sub); font-size:24px;">✕</span>
        </div>
        <input type="hidden" id="editId">
        <div class="form-item"><label>姓名</label><input type="text" id="name"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
            <div class="form-item"><label>性别</label><select id="gender"><option value="🚹 男">男</option><option value="🚺 女">女</option></select></div>
            <div class="form-item"><label>等级</label><select id="level"><option value="⭐">⭐</option><option value="⭐⭐⭐">⭐⭐⭐</option><option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐</option></select></div>
        </div>
        <div class="form-item"><label>手机号</label><input type="tel" id="phone"></div>
        <div class="form-item"><label>微信号</label><input type="text" id="wechat"></div>
        <div class="form-item"><label>公司</label><input type="text" id="company"></div>
        <div class="form-item"><label>状态</label><select id="status"><option value="💡 初步接触">初步接触</option><option value="🤝 正式签约">正式签约</option><option value="⏸️ 暂时搁置">暂时搁置</option></select></div>
        <div class="form-item"><label>核心诉求</label><textarea id="demands" rows="3"></textarea></div>
        <button onclick="save()" id="saveBtn" style="width:100%; padding:18px; background:var(--primary); color:white; border:none; border-radius:20px; font-weight:800; font-size:16px;">同步到云端</button>
        <button id="delBtn" onclick="remove()" style="display:none; width:100%; color:#ef4444; background:none; border:none; margin-top:20px;">🗑️ 抹除此记录</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38'; 
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];

    async function init() {
        try {
            const { data, error } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            customers = data || [];
            document.getElementById('syncStatus').innerText = "✅ 终端已连接";
            render();
        } catch (err) { document.getElementById('syncStatus').innerText = "❌ 卫星链路故障"; }
    }

    function render() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const list = document.getElementById('customerList');
        list.innerHTML = '';
        const res = customers.filter(c => Object.values(c).some(v => String(v).toLowerCase().includes(kw)));
        document.getElementById('totalCount').innerText = `${res.length} 位伙伴`;

        res.forEach((c, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // 生成星星的 HTML 结构，带有不同的延迟时间
            let starHtml = '<div class="stars-container">';
            const starCount = (c.level.match(/⭐/g) || []).length || (c.level.includes('💎') ? 5 : 1);
            for(let i=0; i<starCount; i++) {
                starHtml += `<span class="star-unit" style="animation-delay: ${i * 0.15}s">⭐</span>`;
            }
            starHtml += '</div>';

            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
                    <div class="name">${c.name}<span style="font-size:12px; margin-left:8px; color:#6366f1">${c.gender || ''}</span></div>
                    ${starHtml}
                </div>
                <div style="display:flex; gap:8px; margin-bottom:15px">
                    <span class="mini-tag">🏢 ${c.company || '私域'}</span>
                    <span class="mini-tag ${c.status.includes('签约') ? 'status-active' : ''}">${c.status}</span>
                </div>
                <div class="demand-box" onclick="edit(${c.id})">${c.demands || '待录入诉求...'}</div>
                <div class="action-bar">
                    <a href="tel:${c.phone}" class="action-btn btn-call">📞 拨号</a>
                    <button onclick="copyWx('${c.wechat}')" class="action-btn btn-copy">💬 微信</button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    async function save() {
        const name = document.getElementById('name').value;
        if(!name) return alert("姓名不可为空");
        const btn = document.getElementById('saveBtn');
        btn.innerText = "传输中..."; btn.disabled = true;
        const row = { name, gender: document.getElementById('gender').value, level: document.getElementById('level').value, phone: document.getElementById('phone').value, wechat: document.getElementById('wechat').value, company: document.getElementById('company').value, status: document.getElementById('status').value, demands: document.getElementById('demands').value };
        const id = document.getElementById('editId').value;
        try {
            if(id) await supabaseClient.from('customers').update(row).eq('id', id);
            else await supabaseClient.from('customers').insert([row]);
            await init(); closeModal();
        } catch (e) { alert("同步失败"); }
        finally { btn.innerText = "同步到云端"; btn.disabled = false; }
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; document.getElementById('editId').value = ''; document.querySelectorAll('input, select, textarea').forEach(i => i.value = ''); document.getElementById('delBtn').style.display = 'none'; }
    function edit(id) {
        const c = customers.find(x => x.id == id);
        document.getElementById('editId').value = c.id;
        document.getElementById('name').value = c.name;
        document.getElementById('gender').value = c.gender || '';
        document.getElementById('level').value = c.level;
        document.getElementById('phone').value = c.phone || '';
        document.getElementById('wechat').value = c.wechat || '';
        document.getElementById('company').value = c.company || '';
        document.getElementById('status').value = c.status;
        document.getElementById('demands').value = c.demands || '';
        document.getElementById('delBtn').style.display = 'block';
        openModal();
    }
    function copyWx(wx) { if(!wx) return alert("无微信号"); navigator.clipboard.writeText(wx); alert("复制成功"); }
    async function remove() { if(confirm("确定抹除吗？")) { await supabaseClient.from('customers').delete().eq('id', document.getElementById('editId').value); await init(); closeModal(); } }
    function exportData() { alert("准备导出决策报告..."); }
    init();
    document.getElementById('searchBox').oninput = render;
</script>
</body>
</html>
