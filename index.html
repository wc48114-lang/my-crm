<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>私享客 CRM V4.6 - 全能增强版</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #6366f1; --accent: #f59e0b; --bg: #f8fafc; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        body { font-family: system-ui, sans-serif; margin: 0; padding-bottom: 100px; background: linear-gradient(-45deg, #4f46e5, #7c3aed, #2563eb, #0891b2); background-size: 400% 400%; animation: gradientBG 15s ease infinite; min-height: 100vh; }
        .glass { background: rgba(248, 250, 252, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); min-height: 100vh; }
        .stats { margin: 15px; padding: 20px; background: var(--primary); color: white; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #searchBox { width: calc(100% - 30px); margin: 0 15px 15px; padding: 14px 20px; border: none; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); font-size: 16px; outline: none; box-sizing: border-box; }
        .card { background: white; border-radius: 24px; padding: 20px; margin: 0 15px 15px; position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .vip-tag { position: absolute; top: 0; right: 20px; background: var(--accent); color: white; padding: 4px 10px; border-radius: 0 0 10px 10px; font-size: 10px; font-weight: bold; }
        .nav { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; height: 65px; border-radius: 30px; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .add-btn { width: 55px; height: 55px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -35px; border: 4px solid #f8fafc; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: flex-end; backdrop-filter: blur(5px); }
        .modal-content { background: white; width: 100%; border-radius: 30px 30px 0 0; padding: 25px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; font-size: 14px; outline: none; box-sizing: border-box; }
        .label { font-size: 12px; color: #64748b; margin-top: 5px; margin-left: 5px; }
    </style>
</head>
<body>

<div class="glass">
    <div class="stats">
        <div style="font-size: 14px; opacity: 0.9;">☁️ 同步状态：<span id="syncStatus">📡 连接中...</span></div>
        <div style="font-size: 28px; font-weight: 800; margin: 5px 0;" id="totalCount">加载中...</div>
    </div>
    <input type="text" id="searchBox" placeholder="🔍 搜索姓名、公司或备注..." oninput="render()">
    <div id="customerList"></div>
</div>

<div class="nav">
    <div style="color:white; font-size:12px;" onclick="location.reload()">🏠 首页</div>
    <div class="add-btn" onclick="openModal()">+</div>
    <div style="color:white; font-size:12px;" onclick="alert('数据已加密同步至云端')">🛡️ 安全</div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin:0 0 15px 0;">编辑客户档案</h3>
        <input type="hidden" id="editId">
        
        <div class="form-grid">
            <div><div class="label">姓名</div><input type="text" id="name" placeholder="必填"></div>
            <div>
                <div class="label">性别</div>
                <select id="gender">
                    <option value="未指定">请选择</option>
                    <option value="🚹 男">男</option>
                    <option value="🚺 女">女</option>
                </select>
            </div>
        </div>

        <div class="form-grid">
            <div><div class="label">生日</div><input type="date" id="birthday"></div>
            <div>
                <div class="label">级别</div>
                <select id="level">
                    <option value="⭐">普通</option>
                    <option value="⭐⭐⭐">重要</option>
                    <option value="⭐⭐⭐⭐⭐">核心VIP</option>
                </select>
            </div>
        </div>

        <div class="form-grid">
            <div><div class="label">联系电话</div><input type="tel" id="phone" placeholder="手机号"></div>
            <div><div class="label">微信号</div><input type="text" id="wechat" placeholder="微信ID"></div>
        </div>

        <div class="label">公司/组织</div>
        <input type="text" id="company" placeholder="所在单位">

        <div class="form-grid">
            <div>
                <div class="label">当前状态</div>
                <select id="status">
                    <option value="💡 初步接触">初步接触</option>
                    <option value="📄 方案报价">方案报价</option>
                    <option value="🤝 正式签约">正式签约</option>
                    <option value="⏸️ 暂时搁置">暂时搁置</option>
                </select>
            </div>
            <div>
                <div class="label">客户来源</div>
                <select id="source">
                    <option value="未知">来源渠道</option>
                    <option value="🤝 朋友推荐">朋友推荐</option>
                    <option value="🔍 网络搜索">网络搜索</option>
                    <option value="📱 社交媒体">社交媒体</option>
                    <option value="🏢 线下活动">线下活动</option>
                </select>
            </div>
        </div>

        <div class="label">核心诉求</div>
        <textarea id="demands" rows="2" placeholder="客户最想要什么..."></textarea>
        <div class="label">其他备注</div>
        <textarea id="notes" rows="2" placeholder="性格、喜好等补充信息..."></textarea>

        <button onclick="save()" id="saveBtn" style="width:100%; padding:16px; background:var(--primary); color:white; border:none; border-radius:15px; font-weight:bold; font-size:16px; margin-top:10px;">保存至云端</button>
        <button onclick="closeModal()" style="width:100%; background:none; border:none; color:gray; margin-top:10px;">取消修改</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    // 🔑 这是我已经帮你填好的真钥匙
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38'; 
    
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];

    async function init() {
        try {
            const { data, error } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            customers = data || [];
            document.getElementById('syncStatus').innerText = "✅ 已同步";
            render();
        } catch (err) {
            document.getElementById('syncStatus').innerText = "❌ 连接失败";
            render();
        }
    }

    function render() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const list = document.getElementById('customerList');
        list.innerHTML = '';
        const res = customers.filter(c => Object.values(c).some(v => String(v).toLowerCase().includes(kw)));
        document.getElementById('totalCount').innerText = `${res.length} 位伙伴`;
        res.forEach(c => {
            list.innerHTML += `
                <div class="card" onclick="edit(${c.id})">
                    <div class="vip-tag">${c.level || '⭐'}</div>
                    <h3 style="margin:0">${c.name} <span style="font-size:12px; font-weight:normal; color:#94a3b8">${c.gender || ''}</span></h3>
                    <div style="font-size:12px; color:#64748b; margin:5px 0;">${c.company || '个人客户'} | ${c.status}</div>
                    ${c.birthday ? `<div style="font-size:11px; color:#f59e0b;">🎂 生日：${c.birthday}</div>` : ''}
                    <div style="font-size:13px; background:#f1f5f9; padding:10px; border-radius:10px; margin-top:10px;">🎯 ${c.demands || '暂无诉求'}</div>
                </div>
            `;
        });
    }

    async function save() {
        const name = document.getElementById('name').value;
        if(!name) return alert("请输入姓名");
        const btn = document.getElementById('saveBtn');
        btn.innerText = "同步中..."; btn.disabled = true;

        const row = {
            name,
            gender: document.getElementById('gender').value,
            birthday: document.getElementById('birthday').value || null,
            level: document.getElementById('level').value,
            phone: document.getElementById('phone').value,
            wechat: document.getElementById('wechat').value,
            company: document.getElementById('company').value,
            status: document.getElementById('status').value,
            source: document.getElementById('source').value,
            demands: document.getElementById('demands').value,
            notes: document.getElementById('notes').value
        };

        const id = document.getElementById('editId').value;
        try {
            if(id) await supabaseClient.from('customers').update(row).eq('id', id);
            else await supabaseClient.from('customers').insert([row]);
            await init(); 
            closeModal();
        } catch (err) {
            alert("同步失败，请确保已在 Supabase 运行 ALTER TABLE 指令");
        } finally {
            btn.innerText = "保存至云端"; btn.disabled = false;
        }
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { 
        document.getElementById('modal').style.display = 'none'; 
        document.getElementById('editId').value = '';
        document.querySelectorAll('input, select, textarea').forEach(i => i.value = (i.tagName === 'SELECT' ? i.options[0].value : ''));
    }

    function edit(id) {
        const c = customers.find(x => x.id == id);
        document.getElementById('editId').value = c.id;
        document.getElementById('name').value = c.name || '';
        document.getElementById('gender').value = c.gender || '未指定';
        document.getElementById('birthday').value = c.birthday || '';
        document.getElementById('level').value = c.level || '⭐';
        document.getElementById('phone').value = c.phone || '';
        document.getElementById('wechat').value = c.wechat || '';
        document.getElementById('company').value = c.company || '';
        document.getElementById('status').value = c.status || '💡 初步接触';
        document.getElementById('source').value = c.source || '未知';
        document.getElementById('demands').value = c.demands || '';
        document.getElementById('notes').value = c.notes || '';
        openModal();
    }
    init();
</script>
</body>
</html>
