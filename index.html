<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纵横 · 顶级决策系统</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --dark: #0f172a; --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'PingFang SC', sans-serif; background: var(--bg); margin: 0; padding-bottom: 110px; }
        .hero { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 50px 25px 80px; color: white; border-bottom-left-radius: 50px; border-bottom-right-radius: 50px; }
        .hero-num { font-size: 65px; font-weight: 900; }
        .search-area { margin: -40px 20px 20px; position: relative; z-index: 10; }
        #searchBox { width: 100%; padding: 20px 25px 20px 60px; border: none; border-radius: 25px; background: white; box-shadow: 0 15px 35px rgba(0,0,0,0.08); font-size: 16px; box-sizing: border-box; outline: none; }
        .search-icon { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: var(--primary); }
        .card { background: white; margin: 0 16px 18px; padding: 22px; border-radius: 35px; box-shadow: 0 8px 20px rgba(0,0,0,0.03); position: relative; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .cust-id-tag { font-size: 10px; font-family: monospace; background: #f1f5f9; padding: 2px 8px; border-radius: 5px; color: #64748b; }
        .memo-preview { background: #f1f5f9; padding: 15px; border-radius: 15px; font-size: 13px; margin-top: 12px; color: #475569; border-left: 3px solid var(--primary); }
        .tab-bar { position: fixed; bottom: 0; width: 100%; height: 95px; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); display: flex; align-items: center; z-index: 1000; border-top: 1px solid #eee; }
        .tab-item { flex: 1; text-align: center; color: #94a3b8; font-size: 11px; font-weight: 800; }
        .tab-item.active { color: var(--primary); }
        .add-btn { width: 65px; height: 65px; background: var(--primary); color: white; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-top: -45px; border: 6px solid var(--bg); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 2000; align-items: flex-end; }
        .modal-content { background: white; width: 100%; border-radius: 45px 45px 0 0; padding: 30px; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
        .input { width: 100%; padding: 14px; border: 2px solid #f1f5f9; border-radius: 15px; background: #f8fafc; box-sizing: border-box; font-size: 15px; outline: none; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .save-btn { width: 100%; padding: 20px; background: #0f172a; color: white; border: none; border-radius: 22px; font-weight: 900; font-size: 17px; }
        .page-view { display: none; padding: 20px; }
        .page-view.active { display: block; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .info-item { font-size: 13px; color: #64748b; }
        .info-item b { color: #0f172a; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

<div id="view-list" class="page-view active" style="padding:0;">
    <div class="hero">
        <div style="opacity:0.5; font-size:10px; letter-spacing:3px;">SYSTEM ONLINE</div>
        <div class="hero-num" id="totalCount">0</div>
        <div style="font-weight:700;">核心数据同步中</div>
    </div>
    <div class="search-area">
        <i class="fa-solid fa-search search-icon"></i>
        <input type="text" id="searchBox" placeholder="搜寻姓名、ID、地址..." oninput="renderList()">
    </div>
    <div id="listContainer"></div>
</div>

<div id="view-detail" class="page-view">
    <div onclick="switchTab('list')" style="font-weight:800; color:#64748b; margin-bottom:20px;"><i class="fa-solid fa-arrow-left"></i> 返回档案</div>
    <div id="detailContainer"></div>
</div>

<div class="tab-bar">
    <div class="tab-item active" id="tab-list" onclick="switchTab('list')"><i class="fa-solid fa-home"></i><span>列表</span></div>
    <div class="add-btn" onclick="openForm()"><i class="fa-solid fa-plus"></i></div>
    <div class="tab-item" onclick="init()"><i class="fa-solid fa-sync"></i><span>强制刷新</span></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;"><h2 style="margin:0;">维护档案</h2><i class="fa-solid fa-times" onclick="closeForm()"></i></div>
        <input type="hidden" id="editId">
        <input type="text" id="cust_id" class="input" readonly style="background:#eee;" placeholder="编号">
        <div class="grid"><input type="text" id="name" class="input" placeholder="姓名"><input type="text" id="company" class="input" placeholder="公司"></div>
        <div class="grid"><input type="text" id="job" class="input" placeholder="职务"><input type="tel" id="phone" class="input" placeholder="电话"></div>
        <input type="email" id="email" class="input" placeholder="电子邮箱">
        <input type="text" id="address" class="input" placeholder="地区/详细地址">
        <textarea id="demands" rows="4" class="input" placeholder="决策备忘录"></textarea>
        <button class="save-btn" onclick="saveData()">存入决策云端</button>
    </div>
</div>

<script>
    const SB_URL = 'https://vnyjfikjvttwmyzirhzn.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZueWpmaWtqdnR0d215emlyaHpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzE0NTgsImV4cCI6MjA4NDY0NzQ1OH0.SFi8Ze98-Qf0M42BupJjwsiqOxYrdauzRjjt3no7_38';
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);
    let customers = [];

    async function init() {
        const { data, error } = await supabaseClient.from('customers').select('*').order('created_at', { ascending: false });
        if(error) alert("拉取失败：" + error.message);
        customers = data || [];
        renderList();
    }

    function switchTab(view) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
    }

    function renderList() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const container = document.getElementById('listContainer');
        container.innerHTML = '';
        const list = customers.filter(c => (c.name||'').toLowerCase().includes(kw) || (c.address||'').toLowerCase().includes(kw));
        document.getElementById('totalCount').innerText = list.length;
        list.forEach(c => {
            const div = document.createElement('div');
            div.className = 'card';
            div.onclick = () => showDetail(c.id);
            div.innerHTML = `
                <div class="card-header"><span style="font-size:22px; font-weight:900;">${c.name}</span><span class="cust-id-tag">${c.cust_id || 'NEW'}</span></div>
                <div style="font-size:13px; color:#64748b;">${c.company || '个人'} · ${c.job || '-'}</div>
                <div class="memo-preview">${c.address ? '📍 ' + c.address : '暂无地址情报'}</div>
            `;
            container.appendChild(div);
        });
    }

    function showDetail(id) {
        const c = customers.find(x => x.id == id);
        switchTab('detail');
        document.getElementById('detailContainer').innerHTML = `
            <div style="background:white; padding:30px; border-radius:40px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                <div style="text-align:center; margin-bottom:25px;">
                    <div style="font-size:12px; color:#94a3b8;">${c.cust_id || 'ID待定'}</div>
                    <h2 style="font-size:35px; margin:5px 0;">${c.name}</h2>
                    <div style="color:var(--primary); font-weight:800;">${c.company} · ${c.job}</div>
                </div>
                <div class="info-grid">
                    <div class="info-item"><b>手机号</b>${c.phone || '-'}</div>
                    <div class="info-item"><b>电子邮箱</b>${c.email || '-'}</div>
                    <div class="info-item"><b>地址/地区</b>${c.address || '-'}</div>
                    <div class="info-item"><b>情报摘要</b>${c.demands || '暂无内容'}</div>
                </div>
                <button onclick="openForm(${c.id})" style="width:100%; margin-top:30px; padding:18px; border-radius:20px; border:none; background:#f1f5f9; font-weight:900;">编辑档案</button>
            </div>
        `;
    }

    function openForm(id = null) {
        if(id) {
            const c = customers.find(x => x.id == id);
            document.getElementById('editId').value = c.id;
            document.getElementById('cust_id').value = c.cust_id || '';
            document.getElementById('name').value = c.name || '';
            document.getElementById('company').value = c.company || '';
            document.getElementById('job').value = c.job || '';
            document.getElementById('phone').value = c.phone || '';
            document.getElementById('email').value = c.email || '';
            document.getElementById('address').value = c.address || '';
            document.getElementById('demands').value = c.demands || '';
        } else {
            document.querySelectorAll('.input').forEach(i => i.value = '');
            document.getElementById('editId').value = '';
            document.getElementById('cust_id').value = 'ID-' + Math.random().toString(36).substr(2, 6).toUpperCase();
        }
        document.getElementById('modal').style.display = 'flex';
    }

    async function saveData() {
        const row = {
            cust_id: document.getElementById('cust_id').value,
            name: document.getElementById('name').value,
            company: document.getElementById('company').value,
            job: document.getElementById('job').value,
            phone: document.getElementById('phone').value,
            email: document.getElementById('email').value,
            address: document.getElementById('address').value,
            demands: document.getElementById('demands').value
        };
        const id = document.getElementById('editId').value;
        const { error } = id ? await supabaseClient.from('customers').update(row).eq('id', id) : await supabaseClient.from('customers').insert([row]);
        if(error) alert("操作失败：" + error.message);
        else { alert("决策情报同步成功！"); closeForm(); init(); switchTab('list'); }
    }

    function closeForm() { document.getElementById('modal').style.display = 'none'; }
    init();
</script>
</body>
</html>
